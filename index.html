<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a0a0a"><meta name="description" content="The Void · jede Woche ab 18 Uhr · seit Oktober 2026 · Nächstes Turnier: Dead Man&#39;s Hand Deepstack"><meta property="og:type" content="website"><meta property="og:title" content="Blue Chip Club"><meta property="og:description" content="The Void · jede Woche ab 18 Uhr · seit Oktober 2026 · Nächstes Turnier: Dead Man&#39;s Hand Deepstack"><meta property="og:image" content="https://bluechipclub.github.io/og.jpg"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image"><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-180.png"><style>body{margin:0;padding:0}[hidden]{display:none!important}</style></head><body><title>Blue Chip Club</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Layout: Poker-Lobby. Feste Kopfleiste, darunter ein Bento-Raster (12 Spalten): großes Siegerbild links, Preispool und Champion rechts, darunter Rangliste, beste Hand, Siegerwand. Eine Schrift (Geist) plus Geist Mono für Zahlen. Gold, Schwarz, Grau. */
:root {
  --bg: #0a0a0a;
  --surface: #121212;
  --surface2: #181818;
  --line: #232323;
  --line2: #2e2e2e;
  --fg: #f4f4f2;
  --grey: #8c8c88;
  --grey2: #5c5c59;
  --gold: #e2b857;
  --gold2: #f3d68f;
  --gold3: #9c7a2f;
  --red: #e5675c;
  --card: #ffffff;
  --blue: #2f6bff;
  --blue2: #8fb0ff;
  --blue3: #173a99;
  --sans: "Geist", "Helvetica Neue", Arial, sans-serif;
  --mono: "Geist Mono", ui-monospace, Menlo, monospace;
  --display: var(--sans);
  --body: var(--sans);
  --serif: var(--sans);
  --ease: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-io: cubic-bezier(0.77, 0, 0.175, 1);
  --r: 20px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
.tl { text-align: left !important; }
html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
body { background: var(--bg); position: relative; z-index: 0; color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -.03em; line-height: 1.1; text-wrap: balance; }
p { margin: 0; text-wrap: pretty; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.eyebrow, .label { font-size: 11px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--grey); }
.eyebrow.gold { color: var(--gold); }
.goldtext { background: linear-gradient(180deg, var(--gold2), var(--gold) 55%, var(--gold3)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.silvertext { background: linear-gradient(90deg, #ffffff, #9b9b9b); -webkit-background-clip: text; background-clip: text; color: transparent; }
button { font: inherit; cursor: pointer; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* ---------- Kopfleiste ---------- */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 31; background: var(--bg); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: rgb(10 10 10 / .78); backdrop-filter: blur(20px) saturate(140%); -webkit-backdrop-filter: blur(20px) saturate(140%); border-bottom: 1px solid var(--line); }
header.top .wrap { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; height: 64px; }
.logo { display: flex; align-items: center; gap: 12px; min-width: 0; }
.coin { width: 30px; height: 30px; flex: none; border-radius: 50%; position: relative; transform-style: preserve-3d;
  background: radial-gradient(circle at 50% 50%, transparent 0 62%, rgb(0 0 0 / .18) 63% 64%, transparent 65%), repeating-conic-gradient(from -7deg, #f5f7ff 0 14deg, transparent 14deg 60deg), radial-gradient(circle at 35% 28%, #4d82ff, #1f55e0 55%, #12379c); box-shadow: inset 0 0 0 1px rgb(255 255 255 / .25), inset 0 -2px 3px rgb(0 0 0 / .35), 0 0 0 1px #0f2f86, 0 6px 16px rgb(31 85 224 / .35); }
.coin::after { content: ""; position: absolute; inset: 7px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #5a8cff, #2459e6 60%, #1745c2); box-shadow: 0 0 0 1px rgb(255 255 255 / .55), inset 0 1px 1px rgb(255 255 255 / .35); }
#brandName { font-weight: 600; letter-spacing: -.02em; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
nav.tabs { position: relative; display: flex; gap: 2px; padding: 4px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; max-width: 100%; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs .pill { position: absolute; top: 4px; bottom: 4px; left: 0; width: 0; border-radius: 999px; background: var(--fg); transition: transform 420ms var(--ease), width 420ms var(--ease); z-index: 0; }
nav.tabs button { position: relative; z-index: 1; border: 0; background: transparent; color: var(--grey); padding: 7px 16px; border-radius: 999px; font-size: 13px; font-weight: 500; white-space: nowrap; transition: color 250ms var(--ease); }
nav.tabs button:hover { color: var(--fg); }
nav.tabs button[aria-selected="true"] { color: #0a0a0a; }
.tools { display: flex; justify-content: flex-end; gap: 8px; }
.icon-btn, .edit-btn { border: 1px solid var(--line); background: var(--surface); color: var(--grey); height: 34px; border-radius: 999px; padding: 0 14px; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 8px; transition: color 200ms var(--ease), border-color 200ms var(--ease), transform 160ms var(--ease); }
.icon-btn:hover, .edit-btn:hover { color: var(--fg); border-color: var(--line2); }
.icon-btn[aria-pressed="true"] { color: var(--gold); border-color: var(--gold3); }
.edit-btn { color: #0a0a0a; background: var(--gold); border-color: var(--gold); }
.edit-btn:hover { color: #0a0a0a; background: var(--gold2); }
.eq { display: inline-flex; gap: 2px; align-items: flex-end; height: 12px; }
.eq i { width: 2px; height: 4px; background: currentColor; border-radius: 1px; }
.icon-btn[aria-pressed="true"] .eq i { animation: eq 900ms var(--ease-io) infinite alternate; }
.icon-btn[aria-pressed="true"] .eq i:nth-child(2) { animation-delay: -300ms; }
.icon-btn[aria-pressed="true"] .eq i:nth-child(3) { animation-delay: -600ms; }
@keyframes eq { from { height: 3px; } to { height: 12px; } }
button:active { transform: scale(0.97); }

main .wrap { padding-block: 24px 96px; }
section.view { display: grid; gap: 16px; }

/* ---------- Karten (Bento) ---------- */
.bento { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
.cardx { position: relative; isolation: isolate; overflow: hidden; border-radius: var(--r); background: linear-gradient(180deg, rgb(24 24 24 / .86), rgb(16 16 16 / .9)); border: 1px solid var(--line); padding: 24px; min-width: 0; }
.cardx::after { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; pointer-events: none; opacity: 0; transition: opacity 300ms var(--ease);
  background: radial-gradient(420px circle at var(--mx, 50%) var(--my, 50%), rgb(226 184 87 / .09), transparent 60%); }
@media (hover: hover) and (pointer: fine) { .cardx:hover::after { opacity: 1; } .cardx:hover { border-color: var(--line2); } }
.cardx { transition: border-color 300ms var(--ease); }
.c8 { grid-column: span 8; } .c4 { grid-column: span 4; } .c12 { grid-column: span 12; } .c6 { grid-column: span 6; } .c3 { grid-column: span 3; }
.head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
.head h2 { font-size: 20px; }
.head .eyebrow { letter-spacing: .1em; }

/* Siegerbild */
.hero { grid-column: 1 / span 8; grid-row: span 2; min-height: 560px; padding: 0; display: grid; align-content: end; background: #000; }
.hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 28%; z-index: -2; }
.hero::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgb(0 0 0 / .15) 0%, rgb(0 0 0 / 0) 25%, rgb(0 0 0 / .6) 50%, rgb(0 0 0 / .95) 100%); }
.hero .ph { position: absolute; inset: 0; z-index: -2; display: grid; place-items: center; font-size: 200px; color: var(--surface2); }
.hero-in { padding: 32px; display: grid; gap: 12px; }
.badge { position: absolute; top: 20px; left: 20px; display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px 6px 8px; border-radius: 999px; background: rgb(10 10 10 / .6); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgb(255 255 255 / .1); font-size: 12px; font-weight: 500; }
.badge .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 4px rgb(226 184 87 / .2); }
.hero h1 { font-size: clamp(44px, 7vw, 88px); letter-spacing: -.045em; line-height: .95; }
.hero .meta { color: rgb(244 244 242 / .72); font-size: 15px; }
.hero .row { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-top: 8px; }

/* Preispool */
.pot { display: grid; gap: 20px; align-content: start; }
.pot .big { display: flex; align-items: baseline; gap: 8px; }
.pot .big b { font-family: var(--mono); font-weight: 500; font-size: clamp(56px, 6vw, 80px); letter-spacing: -.05em; line-height: 1; font-variant-numeric: tabular-nums; }
.pot .big span { color: var(--gold); font-size: 22px; font-weight: 600; }
.payout { display: grid; gap: 12px; }
.prow { display: grid; grid-template-columns: 24px 1fr auto; gap: 12px; align-items: center; font-size: 14px; }
.prow .nm { color: var(--fg); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow .nm.open { color: var(--grey2); }
.prow .v { font-family: var(--mono); color: var(--grey); font-variant-numeric: tabular-nums; }
.prow .track { grid-column: 2 / 4; height: 3px; border-radius: 3px; background: var(--surface2); overflow: hidden; margin-top: -6px; }
.prow .track i { display: block; height: 100%; border-radius: 3px; background: var(--gold); transform-origin: left; }
.prow:nth-child(2) .track i { background: #c9c9c6; } .prow:nth-child(3) .track i { background: #a7774f; }

/* Champion */
.champ { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; }
.champ h3 { font-size: clamp(28px, 3vw, 40px); letter-spacing: -.04em; margin-top: 8px; }
.champ .sub { color: var(--grey); font-size: 14px; margin-top: 4px; }
.chip3d { width: 88px; height: 88px; perspective: 600px; }
.chip3d .c { width: 100%; height: 100%; border-radius: 50%; position: relative; transform-style: preserve-3d;
  background: radial-gradient(circle at 50% 50%, transparent 0 62%, rgb(0 0 0 / .18) 63% 64%, transparent 65%), repeating-conic-gradient(from -7deg, #f5f7ff 0 14deg, transparent 14deg 60deg), radial-gradient(circle at 35% 28%, #4d82ff, #1f55e0 55%, #12379c); box-shadow: inset 0 0 0 1px rgb(255 255 255 / .2), inset 0 -4px 8px rgb(0 0 0 / .35), inset 0 3px 6px rgb(255 255 255 / .18), 0 0 0 2px #0f2f86, 0 22px 44px -12px rgb(31 85 224 / .55); }
.chip3d .c::before { content: ""; position: absolute; inset: 15px; border-radius: 50%; background: radial-gradient(circle at 34% 28%, rgb(255 255 255 / .28), transparent 45%), radial-gradient(circle at 50% 55%, #2a62f0, #1a49cc 70%, #133aa6); box-shadow: 0 0 0 1px rgb(0 0 0 / .25), inset 0 0 0 3px #1a49cc, inset 0 0 0 4px rgb(255 255 255 / .75), inset 0 2px 6px rgb(0 0 0 / .3); }
.chip3d .c::after { content: ""; position: absolute; inset: 24px; border-radius: 50%; border: 1.5px dashed rgb(255 255 255 / .55); }

/* Rang */
.rank { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--grey); border: 1px solid var(--line2); }
.r1 { background: var(--gold); color: #0a0a0a; border-color: var(--gold); }
.r2 { background: #c9c9c6; color: #0a0a0a; border-color: #c9c9c6; }
.r3 { background: #a7774f; color: #0a0a0a; border-color: #a7774f; }

/* Tabelle */
.tbl-wrap { overflow-x: auto; margin: 0 -24px -24px; }
table { border-collapse: collapse; width: 100%; min-width: 560px; }
th, td { padding: 14px 24px; text-align: right; white-space: nowrap; border-top: 1px solid var(--line); }
th { font-size: 11px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--grey2); border-top: 0; padding-top: 0; }
th:nth-child(2), td:nth-child(2) { text-align: left; }
th:first-child, td:first-child { width: 48px; text-align: left; padding-right: 0; }
td { font-family: var(--mono); font-size: 14px; color: var(--grey); font-variant-numeric: tabular-nums; }
td.player { font-family: var(--sans); color: var(--fg); font-size: 15px; font-weight: 500; }
td.pts { color: var(--gold); font-weight: 500; }
tbody tr { transition: background-color 200ms var(--ease); }
@media (hover: hover) { tbody tr:hover { background: rgb(255 255 255 / .02); } }
.medals { display: inline-flex; gap: 3px; margin-left: 8px; vertical-align: middle; }
.dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
.d1 { background: var(--gold); } .d2 { background: #c9c9c6; } .d3 { background: #a7774f; }
.note { color: var(--grey); font-size: 13px; }
.empty { color: var(--grey); font-size: 14px; padding: 8px 0; }

/* Spielkarten */
.pc { position: relative; display: inline-grid; grid-template-rows: auto auto 1fr; justify-items: start; width: 48px; height: 68px; border-radius: 6px; background: #fff; color: #15151a; padding: 4px 5px; flex: none; line-height: 1;
  box-shadow: inset 0 0 0 1px rgb(0 0 0 / .08), 0 1px 0 rgb(0 0 0 / .2), 0 10px 24px -6px rgb(0 0 0 / .6); font-family: var(--sans); }
.pc b { font-size: 15px; font-weight: 700; letter-spacing: -.04em; }
.pc u { text-decoration: none; font-size: 10px; margin-top: 1px; }
.pc i { font-style: normal; font-size: 24px; align-self: end; justify-self: end; }
.pc.face i { font-family: var(--sans); font-weight: 700; font-size: 26px; letter-spacing: -.04em; opacity: .9; }
.pc.s-s { color: #15151a; } .pc.s-h { color: #d0261c; } .pc.s-d { color: #d0261c; } .pc.s-c { color: #15151a; }
.pc.back { background: repeating-linear-gradient(45deg, var(--blue3) 0 4px, var(--blue) 4px 8px); box-shadow: inset 0 0 0 3px #fff, 0 10px 24px -6px rgb(0 0 0 / .6); }
.fan.big .pc u { font-size: 14px; } .fan.big .pc.face i { font-size: 38px; }
.fan { display: flex; padding-left: 12px; }
.fan .pc { margin-left: -12px; }
.fan.big .pc { width: 68px; height: 96px; padding: 7px 8px; border-radius: 8px; }
.fan.big .pc b { font-size: 22px; } .fan.big .pc i { font-size: 36px; }
@media (prefers-reduced-motion: no-preference) {
  .fan .pc { animation: deal 700ms var(--ease) both; animation-delay: calc(var(--k, 0) * 90ms + 250ms); }
  @keyframes deal { from { transform: translate(40px, -24px) rotate(18deg); } }
}

/* Beste Hand */
.best { display: grid; gap: 16px; align-content: start; }
.best h3 { font-size: 28px; letter-spacing: -.03em; }
.best .sub { color: var(--grey); font-size: 14px; }
.best:has(.bpic) { grid-template-rows: auto auto auto 1fr; }
.best .bpic { display: block; min-height: 180px; border-radius: 14px; overflow: hidden; border: 1px solid var(--line2); }
.best .bpic img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 400ms var(--ease); }
.best .bpic:hover img { transform: scale(1.03); }

/* Siegerwand */
.wall { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.wcard { --ang: 0deg; position: relative; isolation: isolate; overflow: hidden; border: 0; border-radius: 18px; padding: 22px 18px 20px; display: grid; justify-items: center; gap: 2px; text-align: center; min-width: 0; background: #0c0c0c;
  transition: transform 500ms var(--ease), box-shadow 500ms var(--ease); box-shadow: 0 0 0 1px rgb(226 184 87 / .18), 0 20px 50px -25px rgb(0 0 0 / .9); }
.wcard::before { content: ""; position: absolute; inset: -60%; z-index: -2; background: conic-gradient(from 0deg, transparent 0 62%, rgb(226 184 87 / .0) 64%, var(--gold2) 72%, var(--gold) 76%, transparent 84%); animation: orbit 6s linear infinite; animation-delay: calc(var(--k, 0) * -1.5s); }
.wcard::after { content: ""; position: absolute; inset: 1px; z-index: -1; border-radius: 17px; background: radial-gradient(120% 70% at 50% 0%, rgb(226 184 87 / .16), transparent 60%), linear-gradient(180deg, #141414, #0b0b0b); }
.wcard .shine { position: absolute; inset: 0; z-index: 2; pointer-events: none; background: linear-gradient(115deg, transparent 35%, rgb(255 240 200 / .16) 48%, transparent 60%); transform: translateX(-120%); animation: sweep 7s var(--ease-io) infinite; animation-delay: calc(var(--k, 0) * 1.1s + 1.2s); }
.wcard .laurel { width: 132px; height: 112px; margin-bottom: 4px; overflow: visible; filter: drop-shadow(0 6px 18px rgb(226 184 87 / .25)); }
.wcard .laurel .lf { transform-box: fill-box; transform-origin: center; }
.wcard .laurel .cup { transform-box: fill-box; transform-origin: 50% 100%; }
.wcard .eyebrow { color: var(--gold); }
.wcard .n { font-size: 24px; font-weight: 600; letter-spacing: -.035em; line-height: 1.1; margin-top: 6px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  background: linear-gradient(180deg, #fff6dc, var(--gold2) 40%, var(--gold) 70%, var(--gold3)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.wcard .n.open { background: none; color: var(--grey2); }
.wcard .d { color: var(--grey); font-size: 13px; }
.wcard .pt { margin-top: 10px; font-family: var(--mono); font-size: 12px; color: var(--fg); border: 1px solid rgb(226 184 87 / .3); border-radius: 999px; padding: 4px 10px; background: rgb(226 184 87 / .06); }
.wcard.cur { box-shadow: 0 0 0 1px rgb(226 184 87 / .45), 0 0 60px -10px rgb(226 184 87 / .35), 0 20px 50px -25px rgb(0 0 0 / .9); }
.wcard .crown { position: absolute; top: 12px; left: 12px; z-index: 3; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: #0a0a0a; background: linear-gradient(180deg, var(--gold2), var(--gold)); border-radius: 999px; padding: 3px 8px; font-weight: 600; }
@media (hover: hover) and (pointer: fine) { .wcard:hover { transform: translateY(-6px) scale(1.015); box-shadow: 0 0 0 1px rgb(226 184 87 / .6), 0 0 70px -10px rgb(226 184 87 / .45), 0 30px 60px -25px rgb(0 0 0 / .9); } .wcard:hover .cup { animation: bob 900ms var(--ease) both; } }
@media (max-width: 600px) { .wall { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } .wcard { padding: 34px 10px 16px; } .wcard .laurel { width: 96px; height: 82px; } .wcard .n { font-size: 19px; } .wcard .eyebrow { font-size: 9px; letter-spacing: .1em; } .wcard .crown { top: 8px; left: 50%; transform: translateX(-50%); font-size: 9px; } }
@keyframes orbit { to { transform: rotate(360deg); } }
@keyframes sweep { 0%, 55% { transform: translateX(-120%); } 85%, 100% { transform: translateX(120%); } }
@keyframes bob { 40% { transform: translateY(-5px) rotate(-4deg); } 70% { transform: translateY(0) rotate(2deg); } }
@media (prefers-reduced-motion: no-preference) {
  section.view:not([hidden]) .wcard .lf { animation: leaf 700ms var(--ease) both; animation-delay: calc(var(--k, 0) * 120ms + var(--j) * 45ms + 400ms); }
  section.view:not([hidden]) .wcard .cup { animation: cupin 900ms var(--ease) both; animation-delay: calc(var(--k, 0) * 120ms + 300ms); }
  @keyframes leaf { from { opacity: 0; transform: scale(0) rotate(-30deg); } }
  @keyframes cupin { from { opacity: 0; transform: translateY(14px) scale(.7); } }
}
@media (prefers-reduced-motion: reduce) { .wcard::before, .wcard .shine { animation: none; } .wcard::before { opacity: .35; } }

/* ---------- Hintergrund ---------- */
.ambient { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; background: radial-gradient(120% 80% at 50% -10%, #17140d 0%, var(--bg) 55%); }
.ambient .orb { position: absolute; width: 60vmax; height: 60vmax; border-radius: 50%; filter: blur(80px); opacity: .5; mix-blend-mode: screen; }
.ambient .o1 { background: radial-gradient(circle, rgb(226 184 87 / .32), transparent 65%); left: -15vmax; top: -20vmax; }
.ambient .o2 { background: radial-gradient(circle, rgb(47 107 255 / .22), transparent 65%); right: -20vmax; top: 20vh; }
.ambient .o3 { background: radial-gradient(circle, rgb(226 184 87 / .18), transparent 65%); left: 20vw; bottom: -35vmax; }

.menu-in { width: min(1240px, 100%); margin: 0 auto; padding: 96px max(24px, env(safe-area-inset-left)) 40px; display: grid; gap: 40px; }
.menu-links { display: grid; gap: 4px; }
.menu-links a { color: var(--fg); text-decoration: none; font-size: clamp(36px, 9vw, 72px); line-height: 1.08; letter-spacing: -.03em; font-weight: 500; opacity: 0; transform: translateY(16px); animation: mrise 700ms var(--ease) forwards; }
.menu-links a:nth-child(2) { animation-delay: 60ms; } .menu-links a:nth-child(3) { animation-delay: 120ms; } .menu-links a:nth-child(4) { animation-delay: 180ms; } .menu-links a:nth-child(5) { animation-delay: 240ms; } .menu-links a:nth-child(6) { animation-delay: 300ms; }
@keyframes mrise { to { opacity: 1; transform: none; } }
.menu-links a:hover { color: var(--blue2); }
.menu-tools { display: flex; flex-wrap: wrap; gap: 10px; }
.menu-tools .icon-btn { height: 42px; padding: 0 18px; background: transparent; border-color: rgb(255 255 255 / .18); color: var(--fg); }
.menu-tools .ldot { width: 7px; height: 7px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 10px var(--blue); }
.menu-foot { color: var(--grey2); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
body.menu-open { overflow: hidden; }

/* Bühne: ein Chip, viel Schwarz */
main .wrap { padding-top: 0; }
.stage { position: relative; min-height: calc(100svh - 72px); display: grid; grid-template-rows: 1fr auto; justify-items: center; text-align: center; padding: 24px 0 104px; margin-bottom: 48px; }
.stage-chip { position: relative; align-self: center; width: clamp(150px, 34vw, 260px); aspect-ratio: 1; perspective: 900px; margin-top: 4vh; }
.bigchip { position: absolute; inset: 0; border-radius: 50%; transform-style: preserve-3d;
  background: radial-gradient(circle at 50% 50%, transparent 0 61%, rgb(0 0 0 / .25) 62% 63%, transparent 64%), repeating-conic-gradient(from -7deg, #eef2ff 0 13deg, transparent 13deg 45deg), radial-gradient(circle at 35% 28%, #5b8dff, #1f55e0 55%, #0f2f8a);
  box-shadow: inset 0 0 0 2px rgb(255 255 255 / .22), inset 0 -6px 14px rgb(0 0 0 / .45), 0 0 0 1px #0c2770, 0 0 60px rgb(47 107 255 / .55), 0 0 160px rgb(47 107 255 / .35); }
.bigchip .face { position: absolute; inset: 17%; border-radius: 50%; background: radial-gradient(circle at 34% 26%, rgb(255 255 255 / .35), transparent 42%), radial-gradient(circle at 50% 55%, #2c64f2, #1a49cc 70%, #12389f); box-shadow: inset 0 0 0 3px #1a49cc, inset 0 0 0 5px rgb(255 255 255 / .7), inset 0 3px 8px rgb(0 0 0 / .35); }
.bigchip .face::after { content: ""; position: absolute; inset: 14%; border-radius: 50%; border: 2px dashed rgb(255 255 255 / .45); }
.stage-chip .halo { position: absolute; inset: -60%; border-radius: 50%; background: radial-gradient(circle, rgb(47 107 255 / .32), rgb(47 107 255 / .08) 40%, transparent 65%); filter: blur(10px); }
.stage-chip .floor { position: absolute; left: 10%; right: 10%; bottom: -26%; height: 16%; border-radius: 50%; background: radial-gradient(closest-side, rgb(47 107 255 / .55), transparent); filter: blur(8px); }
.stage-copy { display: grid; gap: 18px; justify-items: center; max-width: 640px; padding-top: 6vh; }
.stage-copy .eyebrow { color: var(--grey); letter-spacing: .2em; }
.stage h1 { font-size: clamp(46px, 11vw, 112px); line-height: .95; letter-spacing: -.045em; font-weight: 600; }
.stage h1 em { font-weight: 400; letter-spacing: -.02em; color: #dfe6ff; }
.stage p { color: rgb(244 244 242 / .7); font-size: 16px; max-width: 34ch; }
.ctas { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 6px; }
.btn-light, .btn-ghost { display: inline-flex; align-items: center; height: 48px; padding: 0 24px; border-radius: 999px; font-size: 15px; font-weight: 600; text-decoration: none; }
.btn-light { background: #f4f4f2; color: #0a0a0a; }
.btn-ghost { color: var(--fg); border: 1px solid rgb(255 255 255 / .22); background: rgb(255 255 255 / .04); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.scrollhint { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); font-size: 10px; letter-spacing: .24em; text-transform: uppercase; color: var(--grey2); display: grid; justify-items: center; gap: 8px; }
.scrollhint::after { content: ""; width: 1px; height: 28px; background: linear-gradient(var(--grey2), transparent); }

/* Chip-Fall: einmalig, danach langsames Drehen */
@media (prefers-reduced-motion: no-preference) {
  .stage:not(.go) .bigchip, .stage:not(.go) .floor, .stage:not(.go) .halo { opacity: 0; }
  .stage:not(.go) .stage-copy > * { opacity: 0; }
  .stage.go:not(.landed) .bigchip { animation: chipfall 1500ms cubic-bezier(.55,.05,.35,1) both; }
  .stage.go:not(.landed) .floor { animation: floorin 1500ms ease-out both; }
  .stage.go:not(.landed) .halo { animation: haloin 1800ms ease-out both; }
  @keyframes chipfall { 0% { opacity: 0; transform: translateY(-70vh) rotateX(70deg) rotateZ(-40deg); } 15% { opacity: 1; } 78% { transform: translateY(0) rotateX(0) rotateZ(0); } 88% { transform: translateY(-3%) rotateX(8deg); } 100% { transform: none; } }
  @keyframes floorin { 0%, 60% { opacity: 0; transform: scaleX(.3); } 100% { opacity: 1; transform: none; } }
  @keyframes haloin { 0%, 55% { opacity: 0; } 100% { opacity: 1; } }
  .stage.landed .bigchip { animation: chipidle 9s var(--ease-io) infinite; }
  @keyframes chipidle { 0%, 60% { transform: rotateY(0); } 100% { transform: rotateY(360deg); } }
  .stage.landed .halo { animation: breathe 6s ease-in-out infinite alternate; }
  @keyframes breathe { from { opacity: .75; } to { opacity: 1; } }
  .stage.go .stage-copy > * { opacity: 0; transform: translateY(24px); animation: rise2 800ms var(--ease) forwards; }
  .stage.go .stage-copy > *:nth-child(1) { animation-delay: 1100ms; } .stage.go .stage-copy > *:nth-child(2) { animation-delay: 1250ms; } .stage.go .stage-copy > *:nth-child(3) { animation-delay: 1400ms; } .stage.go .stage-copy > *:nth-child(4) { animation-delay: 1550ms; }
  .stage.landed .stage-copy > * { animation: none; opacity: 1; transform: none; }
  @keyframes rise2 { to { opacity: 1; transform: none; } }
  /* Einblenden beim Scrollen: 700 ms von unten */
  section.view:not([hidden]) .cardx { animation: none; }
  .rv { opacity: 0; transform: translateY(24px); transition: opacity 700ms var(--ease), transform 700ms var(--ease); }
  .rv.in { opacity: 1; transform: none; }
  tr.rv { transform: translateY(12px); }
}

/* Kacheln: Glas statt grauer Boxen */
.cardx { background: linear-gradient(180deg, rgb(255 255 255 / .035), rgb(255 255 255 / .01)); border: 1px solid var(--line); border-radius: 28px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.cardx::after { background: radial-gradient(420px circle at var(--mx, 50%) var(--my, 50%), rgb(47 107 255 / .10), transparent 60%); }
.head h2 { font-size: clamp(26px, 4vw, 36px); font-weight: 500; letter-spacing: -.035em; }
.head h2 em { color: #dfe6ff; }

/* Rangliste: Chip-Stapel wachsen, Platz 1 im Goldlicht */
.board td.player { position: relative; }
.stack { display: block; height: 6px; margin-top: 8px; width: min(220px, 100%); border-radius: 3px; overflow: hidden; background: rgb(255 255 255 / .05); }
.stack i { display: block; height: 100%; width: calc(var(--w) * 100%); border-radius: 3px; transform-origin: left; background: repeating-linear-gradient(90deg, #2f6bff 0 9px, #e9eeff 9px 11px); box-shadow: 0 0 12px rgb(47 107 255 / .5); transform: scaleX(0); transition: transform 1100ms var(--ease) 200ms; }
tr.in .stack i, .board tr:not(.rv) .stack i { transform: scaleX(1); }
.board tr.lead .stack i { background: repeating-linear-gradient(90deg, #e2b857 0 9px, #fff4d6 9px 11px); box-shadow: 0 0 16px rgb(226 184 87 / .55); }
.board tr.lead td { background: linear-gradient(90deg, rgb(226 184 87 / .08), transparent 70%); }
.board td.pts { color: var(--fg); }
.board tr.lead td.pts { color: var(--gold); }

@media (max-width: 960px) {

}
@media (max-width: 600px) {

  .stage-copy { padding-top: 7vh; gap: 14px; }
  .stage p { font-size: 15px; }

  .stack { width: 100%; }
  #brandName { font-size: 11px; letter-spacing: .16em; }
}
@media (prefers-reduced-motion: reduce) { .menu-links a { animation: none; opacity: 1; transform: none; } }

.cancel-banner { top: calc(env(safe-area-inset-top, 0px) + 80px); }
@media (max-width: 600px) { .cancel-banner { top: calc(env(safe-area-inset-top, 0px) + 70px); } }
/* v2: Gold knapp halten */
.cancel-banner { position: absolute; }
.hero .eyebrow.gold { color: rgb(244 244 242 / .7); }
.pot .big span { color: var(--grey); }
.prow .track i { background: var(--blue); } .prow:nth-child(2) .track i { background: #8fb0ff; } .prow:nth-child(3) .track i { background: #44506e; }
.wcard:not(.cur)::before { display: none; }
.wcard:not(.cur)::after { background: radial-gradient(120% 70% at 50% 0%, rgb(47 107 255 / .10), transparent 60%), linear-gradient(180deg, #111318, #0a0b0d); }
.wcard:not(.cur) .laurel { filter: grayscale(1) brightness(.8) contrast(1.1); opacity: .75; }
.wcard:not(.cur) .eyebrow { color: var(--grey); }
.wcard:not(.cur) .n { background: none; -webkit-text-fill-color: currentColor; color: var(--fg); }
.wcard:not(.cur) .pt { border-color: rgb(255 255 255 / .14); background: transparent; }
.wcard:not(.cur) .shine { display: none; }
.wcard:not(.cur) { box-shadow: inset 0 0 0 1px rgb(255 255 255 / .08); }
.board tr.lead td { background: none; }
/* ---------- v2: Chip-Intro (Video) ---------- */
.cintro { position: fixed; inset: 0; z-index: 110; background: #000; overflow: hidden; transition: opacity 700ms var(--ease); }
.cintro.out { opacity: 0; }
.cin-cam { position: absolute; inset: 0; transform-origin: 50% 50%; transition: transform 2200ms cubic-bezier(.65,0,.35,1); }
.cintro video { width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; display: block; }
@media (orientation: portrait) { .cintro video { object-fit: contain; } }
.cintro.fin .cin-cam { transform: none; }
.cin-name { position: absolute; left: 50%; top: 50%; display: grid; justify-items: center; line-height: .92; transform: translate(-50%, -50%) scale(0); font-family: var(--sans); font-weight: 800; text-transform: uppercase; letter-spacing: -.01em; color: #fff; text-shadow: 0 1px 0 #c9d6ff, 0 2px 0 #9fb4f5, 0 3px 6px rgb(5 20 70 / .7), 0 0 18px rgb(150 190 255 / .55); pointer-events: none; }
.cintro .cin-name { font-size: var(--nm, 9px); }
.cintro.fin .cin-name { animation: inflate 1100ms cubic-bezier(.34,1.56,.64,1) 900ms forwards; }
@keyframes inflate { 0% { transform: translate(-50%, -50%) scale(0); opacity: 0; } 60% { opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
.cintro .skip { position: absolute; z-index: 2; right: calc(16px + env(safe-area-inset-right)); top: calc(16px + env(safe-area-inset-top)); height: 40px; padding: 0 18px; border-radius: 999px; border: 1px solid rgb(255 255 255 / .3); background: rgb(0 0 0 / .45); color: #fff; font-size: 13px; font-weight: 600; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
@media (max-width: 600px) { .cintro .skip { top: auto; bottom: calc(24px + env(safe-area-inset-bottom)); right: 50%; transform: translateX(50%); height: 48px; padding: 0 28px; font-size: 15px; } }
/* Chip mit Silberschrift (Variante C) bläst sich am Ende auf */
.cin-chip { position: absolute; left: 50%; top: 50%; width: 80px; height: 80px; transform: translate(-50%, -50%) scale(.4); opacity: 0; pointer-events: none; border-radius: 50%; }
.cintro.fin .cin-chip { animation: emerge 1800ms cubic-bezier(.22,1,.36,1) 1100ms forwards; }
@keyframes emerge { 0% { opacity: 0; filter: brightness(.2) blur(6px); transform: translate(-50%, -50%) scale(.9); } 45% { opacity: .85; filter: brightness(1.5) blur(1px) drop-shadow(0 0 12px rgb(200 220 255 / .8)); } 100% { opacity: 1; filter: brightness(1) blur(0) drop-shadow(0 2px 3px rgb(0 0 0 / .45)); transform: translate(-50%, -50%) scale(1); } }
@keyframes inflate2 { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.4); } 35% { opacity: 1; } 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
/* Bühnen-Chip: echtes Foto mit Namen */
.bigchip.photo { background: none; border-radius: 50%; inset: 0; box-shadow: 0 0 0 1px rgb(255 255 255 / .06), 0 30px 60px -10px rgb(0 0 0 / .9), 0 0 120px rgb(47 107 255 / .35); }
.bigchip.photo img { border-radius: 50%; }
.bigchip.photo img { width: 100%; height: 100%; display: block; }
.stage-chip { container-type: inline-size; }

.stage-chip .halo { inset: -40%; background: radial-gradient(circle, rgb(47 107 255 / .20), transparent 60%); }
.stage.landed .bigchip.photo { animation: none; }
/* ---------- v2: Bildband „The Void“ (Tims Tischfoto) ---------- */
.voidband { position: relative; margin: 0 calc(50% - 50vw) 56px; height: min(78svh, 720px); overflow: hidden; display: grid; align-items: end; isolation: isolate; }
.voidband img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 70%; z-index: -2; transform: scale(1.06); transition: transform 1600ms var(--ease); }
.voidband.in img, .voidband img.in { transform: none; }
.voidband::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, var(--bg) 0%, rgb(7 7 7 / 0) 22%, rgb(7 7 7 / 0) 55%, var(--bg) 100%), radial-gradient(120% 90% at 50% 60%, transparent 40%, rgb(7 7 7 / .7)); }
.vb-copy { width: min(1240px, 100%); margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-left)) 40px; display: grid; gap: 10px; }
.vb-copy h2 { font-size: clamp(36px, 7vw, 76px); font-weight: 600; letter-spacing: -.04em; line-height: 1; }

@media (max-width: 600px) { .voidband { height: 64svh; margin-bottom: 32px; } .voidband img { object-position: 50% 78%; } }
/* =====================================================================
   v3 (07.11.2026): Messlatte Apple. Jeder Abschnitt eine schwarze Bühne,
   riesige Headline, ein Motiv, viel Luft. Farben bleiben Schwarz/Gold/Blau.
   ===================================================================== */
:root { --bg: #000; }
body, .ambient { background: #000; }
.ambient { background: radial-gradient(70% 50% at 50% 0%, rgb(47 107 255 / .10), transparent 70%), #000; }
main .wrap { max-width: 1180px; }
#v-rangliste:not([hidden]) { display: block !important; }
.scene { padding-block: clamp(80px, 12vw, 160px) 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: clamp(24px, 4vw, 48px); }
.sc-head { display: grid; gap: 6px; }
.sc-kick { font-size: clamp(19px, 2.4vw, 28px); font-weight: 600; letter-spacing: -.01em; color: var(--grey); }
.scene h2 { font-size: clamp(48px, 9vw, 96px); font-weight: 600; letter-spacing: -.045em; line-height: 1; text-wrap: balance; }
.scene h2 em { font-weight: 400; color: #dfe6ff; }
.sc-sub { color: var(--grey); font-size: clamp(17px, 2vw, 21px); }
.sc-link { color: var(--blue2); text-decoration: none; font-size: 17px; justify-self: start; }
.sc-link:hover { text-decoration: underline; }
.chrome { background: linear-gradient(180deg, #ffffff 0%, #d9dde6 38%, #8d93a3 52%, #f2f4f8 70%, #aab0bd 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.chrome-xl { font-size: clamp(88px, 22vw, 260px) !important; line-height: .9 !important; letter-spacing: -.06em !important; background: linear-gradient(180deg, #ffffff 0%, #e3e7ef 35%, #7e8596 50%, #f5f7fb 66%, #9aa1b0 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 10px 40px rgb(47 107 255 / .25)); }
/* Sieger */
.sc-photo { margin: 0; border-radius: 28px; overflow: hidden; aspect-ratio: 16 / 9; background: #111; }
.sc-photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; display: block; transform: scale(1.08); transition: transform 1800ms var(--ease); }
.winner.in .sc-photo img, .sc-photo.in img { transform: none; }
.sc-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.sc-stats div { display: grid; gap: 4px; }

.sc-stats span { color: var(--grey); font-size: 15px; }
.sc-pay { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.pay { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; padding: 18px 20px; border-radius: 22px; background: #111; font-size: 16px; }
.pay .v { font-family: var(--mono); color: var(--grey); }
/* Rangliste als Apple-Liste */
.scene.board .tbl-wrap { margin: 0; border-radius: 28px; background: #0d0d0f; padding: 8px 0; }
.scene.board th { padding-top: 14px; }
.scene.board td.player { font-size: 18px; }
.scene.board td.pts { font-size: 18px; font-weight: 600; }
/* Ewige Nummer 1, Beste Hand */
.scene.sc-champ, .scene.sc-hand { justify-items: center; text-align: center; grid-template-columns: minmax(0, 1fr); }
.scene.sc-hand .fan.big { transform: scale(1.6); margin: 40px 0; }
/* Galgen als Bühne */
#v-rangliste > .bento { margin-top: clamp(80px, 12vw, 160px); }
/* Siegerwand zum Wischen */
.wall.swipe { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(240px, 1fr); grid-template-columns: none; overflow-x: auto; scroll-snap-type: x mandatory; gap: 16px; padding-bottom: 8px; scrollbar-width: none; }
.wall.swipe::-webkit-scrollbar { display: none; }
.wall.swipe .wcard { scroll-snap-align: start; border-radius: 28px; }
.voidband { margin-top: clamp(80px, 12vw, 160px); margin-bottom: 0; }
@media (max-width: 600px) {
  .sc-stats { grid-template-columns: 1fr 1fr; }
  .sc-stats div:last-child { display: none; }
  .sc-pay { grid-template-columns: 1fr; }
  .scene.sc-hand .fan.big { transform: scale(1.25); margin: 24px 0; }
  .wall.swipe { grid-auto-columns: 72%; margin-inline: calc(-1 * max(16px, env(safe-area-inset-left))); padding-inline: max(16px, env(safe-area-inset-left)); }
}
/* v3: Abend-Kacheln und Spieler wie Apple-Highlights */
.tiles.swipe { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(260px, 1fr); overflow-x: auto; scroll-snap-type: x mandatory; gap: 16px; scrollbar-width: none; padding-bottom: 6px; }
.tiles.swipe::-webkit-scrollbar { display: none; }
.tile, .ptile { position: relative; scroll-snap-align: start; border-radius: 28px; overflow: hidden; background: #111; aspect-ratio: 3 / 4; display: block; color: var(--fg); text-decoration: none; isolation: isolate; }
.tile img, .ptile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; transition: transform 900ms var(--ease); }
.tile::after, .ptile::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgb(0 0 0 / .55) 0%, transparent 35%, transparent 55%, rgb(0 0 0 / .85) 100%); }
@media (hover: hover) { .tile:hover img, .ptile:hover img { transform: scale(1.04); } }
.tile-in { position: absolute; inset: auto 0 0 0; padding: 22px; display: grid; gap: 4px; }
.tile .tn { position: absolute; top: -360%; left: 22px; font-family: var(--mono); font-size: 13px; color: rgb(255 255 255 / .7); }
.tile h3, .ptile h3 { font-size: 24px; font-weight: 600; letter-spacing: -.02em; }
.tile p { color: rgb(255 255 255 / .75); font-size: 15px; }
.ptile .nk { color: rgb(255 255 255 / .7); font-family: var(--serif); font-style: italic; font-size: 19px; }
.ptile .pp { color: rgb(255 255 255 / .7); font-size: 14px; }
.ptile .pp b { color: var(--fg); font-size: 18px; }
.crew-row { grid-auto-columns: minmax(220px, 1fr); }

  async function shrink(file) {
    try {
      const bmp = await createImageBitmap(file);
      const s = Math.min(1, 1800 / Math.max(bmp.width, bmp.height));
      if (s === 1 && file.size < 3e6) return file;
      const c = document.createElement('canvas'); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      return await new Promise(r => c.toBlob(b => r(b || file), 'image/jpeg', .86));
    } catch (e) { return file; }
  }

      const lines = id => $(id).value.split('\n').map(l => l.split('|').map(x => x.trim())).filter(a => a.join(''));
      DATA.settings.next = Object.assign(DATA.settings.next || {}, { date: $('#nDate').value, tbd: $('#nTbd').value.trim(), title: $('#nTitle').value.trim(), sub: $('#nSub').value.trim(), buyin: Number($('#nBuy').value) || '', rebuy: Number($('#nReb').value) || '', fee: Number($('#nFee').value) || '', cards: $('#nCards').value.trim(),
        facts: lines('#nFacts').map(a => ({ v: a[0] || '', l: a[1] || '' })), program: lines('#nProg').map(a => ({ t: a[0] || '', l: a[1] || '', s: a[2] || '' })), trophy: $('#nTrophy').value.trim(), info: $('#nInfo').value.trim(), seats: $('#nSeats').value === '' ? 10 : Number($('#nSeats').value),
        signups: [...document.querySelectorAll('.nSign:checked')].map(x => x.value).concat($('#nGuests').value.split(',').map(x => x.trim()).filter(Boolean)) });
      DATA.settings.name = $('#sName').value.trim() || DATA.settings.name;
      DATA.settings.tagline = $('#sTag').value.trim();
      DATA.settings.buyin = Number($('#sBuy').value) || '';
      DATA.settings.wa = $('#sWaN').value.replace(/\D/g, '').replace(/^0+/, '');
      DATA.settings.points = { p1: +$('#s1').value || 0, p2: +$('#s2').value || 0, p3: +$('#s3').value || 0, teil: +$('#sT').value || 0 };
      $('#sSave').disabled = true;
      if (!(await save($('#sStatus'), 'Einstellungen gespeichert'))) $('#sSave').disabled = false;
    };
  }

  /* ---------- v2: Menü, Einblenden, Scroll ---------- */
  function initV2() {
    document.addEventListener('click', e => {
      if (e.target.closest('[data-intro]')) { openIntro(true); return; }
      if (e.target.closest('[data-reserve]')) { if (nextOk()) openEvent(); else { const b = $('#nextbox'); if (b) b.scrollIntoView({ behavior: 'smooth', block: 'center' }); } }
    });
    $('#v-rangliste').insertAdjacentHTML('beforebegin', stageHtml());
    const syncStage = () => { const s = $('.kino'); if (s) s.hidden = $('#v-rangliste').hidden; };
    syncStage(); new MutationObserver(syncStage).observe($('#v-rangliste'), { attributes: true, attributeFilter: ['hidden'] });
    const menu = $('#menu'), mb = $('#menuBtn');
    const setMenu = open => { menu.hidden = !open; mb.setAttribute('aria-expanded', open); document.body.classList.toggle('menu-open', open); };
    mb.addEventListener('click', () => setMenu(menu.hidden));
    menu.addEventListener('click', e => { if (e.target === menu || e.target.closest('a,#liveBtn,#remBtn')) setMenu(false); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !menu.hidden) setMenu(false); });
    document.addEventListener('click', e => { const a = e.target.closest('[data-scroll]'); if (!a) return; const t = $(a.dataset.scroll); if (!t) return; e.preventDefault(); t.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' }); });
    const io = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) { x.target.classList.add('in'); io.unobserve(x.target); } }), { rootMargin: '0px 0px -8% 0px', threshold: 0.08 }) : null;
    const watch = () => document.querySelectorAll('.cardx:not(.rv), .voidband:not(.rv), .scene:not(.rv)').forEach(el => { el.classList.add('rv'); if (io) io.observe(el); else el.classList.add('in'); });
    watch(); new MutationObserver(watch).observe($('main'), { childList: true, subtree: true });
    addEventListener('scroll', () => document.body.classList.toggle('scrolled', scrollY > 40), { passive: true });
  }

  /* ---------- Start ---------- */
  render();
  // Zusagen automatisch: Google-Sheet-Web-App (settings.api) zählt jeden Klick auf „Reservieren“ mit
  function register(n, name, time, note) {
    const api = DATA.settings.api; if (!api || !name) return;
    const body = JSON.stringify({ event: n.title, name, time, note });
    try { fetch(api, { method: 'POST', mode: 'no-cors', credentials: 'omit', keepalive: true, headers: { 'Content-Type': 'text/plain' }, body }).catch(() => {}); } catch (e) {}
    merge(n, [{ name, time }]);
  }
  function merge(n, list) {
    n.signups = signups(n); n.votes = n.votes || {};
    list.forEach(x => { const nm = String(x.name || '').trim(); if (!nm) return; if (!n.signups.includes(nm)) n.signups.push(nm); if (/^\d{1,2}:\d{2}$/.test(x.time || '')) n.votes[nm] = x.time; else if (DAYRX.test(x.time || '')) { n.dvotes = n.dvotes || {}; n.dvotes[nm] = x.time.split('+'); } });
    renderRangliste();
    document.querySelectorAll('.splash .seats').forEach(el => { el.innerHTML = seatTxt(n); });
  }
  function refreshEvent() {
    if ($('#evov').hidden || !$('#resv')) return;
    const m = $('#evm'), tm = $('input[name=rT]:checked'), k = { p: $('#rP').value, g: $('#rG').value, n: $('#rN').value, t: tm && tm.value, dd: [...document.querySelectorAll('input[name=rD]:checked')].map(x => x.value), y: m.scrollTop, a: document.activeElement && document.activeElement.id, gp: $('#gP') && $('#gP').value, gg: $('#gG') && $('#gG').value, gt: $('#gT') && $('#gT').value };
    openEvent();
    $('#rP').value = k.p; $('#rP').onchange(); $('#rG').value = k.g; $('#rN').value = k.n;
    if (k.t) { const r = document.querySelector('input[name=rT][value="' + k.t + '"]'); if (r) r.checked = true; }
    (k.dd || []).forEach(v => { const r = document.querySelector('input[name=rD][value="' + v + '"]'); if (r) r.checked = true; });
    if ($('#gP')) { $('#gP').value = k.gp || ''; $('#gP').onchange(); $('#gG').value = k.gg || ''; $('#gT').value = k.gt || ''; $('#gT').oninput(); }
    m.scrollTop = k.y; if (k.a && $('#' + k.a)) $('#' + k.a).focus({ preventScroll: true });
  }
  (async () => {
    const n = DATA.settings.next, api = DATA.settings.api; if (!n || !api) return;
    try { const j = await (await fetch(api + '?event=' + encodeURIComponent(n.title), { credentials: 'omit' })).json(); if (j.ok) { merge(n, j.signups || []); refreshEvent(); } } catch (e) {}
  })();
  startFx();
  let start = location.hash.slice(1);
  if (!VIEWS.includes(start)) { try { start = sessionStorage.getItem('liga-view') || ''; } catch (e) {} }
  show(start);
  let justSaved = false; try { justSaved = !!sessionStorage.getItem('liga-flash'); } catch (e) {}
  if (!justSaved) openIntro();
  if (!document.querySelector('.intro, .cintro')) requestAnimationFrame(() => setTimeout(landStage, 250));
  initV2();
  try { const f = sessionStorage.getItem('liga-flash'); if (f) sessionStorage.removeItem('liga-flash'); } catch (e) {}

  (async () => {
    const use = window.claude && window.claude.use;
    if (!use) return;
    const [user, art, assets] = await Promise.all([use('user'), use('artifact'), use('assets')].map(p => p.catch(() => null)));
    artifactNs = art; assetsNs = assets;
    try { canEdit = !!(user && await user.isOwner() && await user.canEdit()); } catch (e) { canEdit = false; }
    $('#editBtn').hidden = !(canEdit && artifactNs && SKEL);
  })();
})();
</script>
<div id="codeOv" hidden style="position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.8);backdrop-filter:blur(8px);display:grid;place-items:center;padding:16px">
<div style="width:min(340px,100%);background:#121212;border:1px solid #2e2e2e;border-radius:20px;padding:26px 22px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.8)">
<div id="codeTitle" style="font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--gold);text-transform:uppercase">Live-Tafel</div>
<div style="font-size:22px;font-weight:650;margin:6px 0 16px">Code eingeben</div>
<input id="codeIn" inputmode="numeric" autocomplete="off" maxlength="6" style="width:100%;height:56px;border-radius:14px;border:1px solid #2e2e2e;background:#0a0a0a;color:#f4f4f2;font:600 28px var(--mono);letter-spacing:.4em;text-align:center;outline:none">
<div id="codeErr" style="height:20px;margin-top:8px;font-size:13px;color:var(--red)"></div>
<div style="display:flex;gap:8px;margin-top:6px"><button id="codeNo" class="icon-btn" style="flex:1;justify-content:center;height:42px">Abbrechen</button><button id="codeOk" class="icon-btn" style="flex:1;justify-content:center;height:42px;background:linear-gradient(180deg,#f3d68f,#c49a41);color:#111;border-color:#c49a41;font-weight:650">Öffnen</button></div>
</div></div>
<script>
(function(){const ov=document.getElementById('codeOv'),inp=document.getElementById('codeIn'),err=document.getElementById('codeErr');
const open=()=>{ov.hidden=false;inp.value='';err.textContent='';setTimeout(()=>inp.focus(),50);};
let dest='tafel/';const go=()=>{if(inp.value.trim()==='007'){location.href=dest;}else{err.textContent='Falscher Code';inp.value='';inp.focus();}};
document.getElementById('liveBtn').onclick=()=>window.openLive();window.openLive=(d)=>{dest=d||'tafel/';document.getElementById('codeTitle').textContent=d?'Fernbedienung':'Live-Tafel';open();};document.getElementById('codeNo').onclick=()=>ov.hidden=true;
document.getElementById('codeOk').onclick=go;inp.addEventListener('keydown',e=>{if(e.key==='Enter')go();if(e.key==='Escape')ov.hidden=true;});
ov.addEventListener('click',e=>{if(e.target===ov)ov.hidden=true;});})();
</script>
</body></html>
