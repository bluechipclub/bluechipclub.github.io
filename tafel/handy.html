<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tafel-Fernbedienung</title>
<link rel="icon" href="../favicon.svg">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="preconnect" href="https://ntfy.sh" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..800&family=Geist+Mono:wght@400..700&display=swap">
<style>
:root{--bg:#0a0a0a;--s1:#141414;--s2:#1c1c1c;--line:#2a2a2a;--fg:#f4f4f2;--grey:#8c8c88;--gold:#e2b857;--gold2:#f3d68f;--gold3:#9c7a2f;--red:#e5675c;--blue:#4d82ff;--blue2:#8fb0ff;--sans:"Geist","Helvetica Neue",Arial,sans-serif;--mono:"Geist Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--fg);font-family:var(--sans)}
body{padding:calc(12px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
button{font:inherit;color:inherit;border:1px solid var(--line);background:var(--s2);border-radius:12px;padding:12px 10px;font-weight:600;font-size:15px;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.97);background:#262626}
button.pri{background:linear-gradient(180deg,#f3d68f,#c49a41);color:#111;border-color:#c49a41}
button.red{color:var(--red);border-color:rgba(229,103,92,.45)}
button.sm{padding:8px 10px;font-size:13px;border-radius:9px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.top h1{font-size:18px;font-weight:750;color:var(--gold2)}
.dot{font-family:var(--mono);font-size:11px;color:var(--grey);display:flex;gap:6px;align-items:center;letter-spacing:.06em}
.dot i{width:9px;height:9px;border-radius:50%;background:var(--red)}
.dot.on i{background:var(--blue);box-shadow:0 0 8px var(--blue)}
.clock{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center;margin-bottom:10px}
.clock .l{font-family:var(--mono);font-size:12px;letter-spacing:.25em;color:var(--gold);text-transform:uppercase}
.clock .t{font-family:var(--mono);font-size:56px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.clock .t.p{color:var(--grey)}
.clock .b{font-size:22px;font-weight:720}
.clock .m{font-family:var(--mono);font-size:12px;color:var(--grey);margin-top:6px}
.g{display:grid;gap:8px;margin-bottom:10px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}
h2{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--grey);margin:18px 0 8px;font-weight:500}
.pl{display:grid;gap:6px}
.pr{display:grid;grid-template-columns:1fr auto auto auto;gap:6px;align-items:center;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 12px}
.pr.out{opacity:.5}
.pr .n{font-weight:700;font-size:16px}
.pr .n small{display:block;font-family:var(--mono);font-size:11px;color:var(--grey);font-weight:500;margin-top:2px}
.pr .n small b{color:var(--red);font-weight:500}
input{font:16px var(--sans);background:var(--s2);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%}
.row{display:flex;gap:8px}
.row input{flex:1}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1d1d1d;border:1px solid var(--gold3);border-radius:12px;padding:10px 16px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.6);z-index:9;max-width:90vw}
.toast[hidden]{display:none}
.note{font-size:12px;color:var(--grey);line-height:1.45;margin-top:6px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;z-index:8}
.sheet[hidden]{display:none}
.sheet>div{background:#121212;border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));width:100%;max-width:560px;margin:0 auto}
.sheet h3{font-size:20px;margin-bottom:12px}
.deck{display:grid;gap:10px;margin-bottom:14px}
.pc{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:10px;display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center}
.pc.away{opacity:.55}
.pc .av{width:52px;height:52px;border-radius:50%;overflow:hidden;background:var(--s2);display:grid;place-items:center;font-weight:800;font-size:22px;color:var(--gold2);border:1px solid var(--gold3)}
.pc .av img{width:100%;height:100%;object-fit:cover}
.pc .nm{font-weight:780;font-size:17px;margin-bottom:6px}
.pc .cb{display:flex;flex-wrap:wrap;gap:6px}
.pc .cb button{flex:1 1 46%;padding:16px 8px;font-size:15px;border-color:rgba(226,184,87,.45);background:linear-gradient(180deg,#22201a,#171612)}
.pc .cb button.hit{background:linear-gradient(180deg,#f3d68f,#c49a41);color:#111}
.pc .cb button small{display:block;font-size:10px;color:var(--grey);font-weight:500;margin-top:2px}
.stopbar{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom));z-index:5;margin-top:4px}
.stopbar button{width:100%;padding:16px;font-size:16px;background:#1d1212;border-color:rgba(229,103,92,.6);color:var(--red);box-shadow:0 8px 24px rgba(0,0,0,.6)}
details.ctl{margin-top:18px;border:1px solid var(--line);border-radius:16px;background:#0e0e0e}
details.ctl>summary{list-style:none;cursor:pointer;padding:14px;display:flex;justify-content:space-between;align-items:center;font-weight:700}
details.ctl>summary::-webkit-details-marker{display:none}
details.ctl>summary span{font-family:var(--mono);font-size:12px;color:var(--grey);font-weight:500}
details.ctl[open]>summary{border-bottom:1px solid var(--line)}
details.ctl>.in{padding:12px}
</style>
</head>
<body>
<div class="top"><h1>Stream Deck</h1><div class="dot" id="dot"><i></i><span>verbinde…</span></div></div>

<div class="deck" id="deck"><p class="note">Lade Clips…</p></div>
<div class="stopbar"><button id="clipStop">■ Clip stoppen</button></div>

<details class="ctl" id="ctl"><summary>⚙ Steuerung <span id="sum">Uhr, Spieler, Rebuys …</span></summary><div class="in">
<div class="clock">
  <div class="l" id="lvl">–</div>
  <div class="t p" id="t">--:--</div>
  <div class="b" id="bl">–</div>
  <div class="m" id="meta">Warte auf die Tafel…</div>
</div>

<div class="g g2">
  <button class="pri" id="play">▶ Start / Pause</button>
  <button id="close">✕ Einblendung zu</button>
</div>
<div class="g g2">
  <button data-c='{"op":"seatopen"}' style="border-color:rgba(226,184,87,.6);color:#f3d68f">🪑 Seat open</button>
  <button id="bdayBtn">🎂 Geburtstags-Show</button>
  <button id="lobbyBtn">🖼 Bildschirmschoner an</button>
  <button id="lobbyOff">🖼 Bildschirmschoner aus</button>
</div>
<div class="g g4">
  <button data-c='{"op":"prev"}'>◀ Level</button>
  <button data-c='{"op":"next"}'>Level ▶</button>
  <button data-c='{"op":"time","add":-60}'>−1 Min</button>
  <button data-c='{"op":"time","add":60}'>+1 Min</button>
</div>
<div class="g g2">
  <button data-c='{"op":"dealernext"}'>Dealer ▶</button>
  <button id="drawBtn">Plätze auslosen</button>
</div>

<h2>Spieler</h2>
<div class="pl" id="pl"></div>
<div class="row" style="margin-top:8px"><input id="newP" placeholder="Neuer Spieler"><button id="addP">+ Dazu</button></div>

<h2>Minigame</h2>
<div class="g g2" id="games"></div>
<button id="endGame" style="width:100%">✓ Minigame vorbei</button>

<h2>Durchsage</h2>
<div class="row"><input id="msg" placeholder="z. B. Pizza ist da!"><button class="pri" id="sendMsg">Senden</button></div>
<div class="g g2" style="margin-top:8px">
  <button data-c='{"op":"clearmsg"}'>Laufschrift leeren</button>
  <button data-c='{"op":"players"}'>Spielerliste zeigen</button>
</div>

<h2>Ende</h2>
<div class="g g2">
  <button data-c='{"op":"result"}'>Abrechnung zeigen</button>
  <button id="restartBtn" style="border-color:rgba(229,103,92,.5);color:#e5675c">Turnier neu starten</button>
  <button data-c='{"op":"export"}'>⬇ Export am Laptop</button>
</div>
<p class="note">Befehle kommen in 1–2 Sekunden auf der Tafel an. Klappt das mal nicht, schreib Claude im Chat, das geht immer.</p>
</div></details>

<div class="sheet" id="sheet" hidden><div>
  <h3 id="shT"></h3>
  <div class="g" id="shB"></div>
  <button style="width:100%;margin-top:6px" id="shX">Abbrechen</button>
</div></div>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
const RELAY="https://ntfy.sh/",TOPIC="bcc-8db9b61c4d84441f";
const $=id=>document.getElementById(id);
let st=null,lastAt=0;
function toast(t){const e=$("toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,1800);}
async function send(c,label){
  try{const r=await fetch(RELAY+TOPIC+"-cmd",{method:"POST",body:JSON.stringify(c)});if(!r.ok)throw 0;toast("✓ "+(label||"gesendet"));if(navigator.vibrate)navigator.vibrate(25);}
  catch(e){toast("✕ Nicht gesendet. Netz prüfen oder Claude im Chat schreiben.");}
}
document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>send(JSON.parse(b.dataset.c),b.textContent.trim()));
document.getElementById("restartBtn").onclick=()=>{if(confirm("Turnier neu starten? Uhr auf Level 1, alle Rebuys und Ausgeschiedenen weg. Spieler und Plätze bleiben."))send({op:"restart"},"Neustart");};
$("play").onclick=()=>{
  const run=st&&st.running;send({op:run?"pause":"play"},run?"Pause":"Start");
  if(st){if(run){st.left=Math.max(0,(st.localEnd-Date.now())/1000);st.running=false;st.localEnd=null;}else{st.running=true;st.localEnd=Date.now()+st.left*1000;}
    $("play").textContent=st.running?"❚❚ Pause":"▶ Start";tick();}
};
$("lobbyBtn").onclick=()=>send({op:"lobby"},"Bildschirmschoner an");
$("lobbyOff").onclick=()=>send({op:"lobbyclose"},"Bildschirmschoner aus");
$("bdayBtn").onclick=()=>{if(confirm("Geburtstags-Show jetzt starten? (Startet um 0:00 auch automatisch)"))send({op:"bday"},"Geburtstags-Show");};
$("close").onclick=()=>send({op:"close"},"Einblendung zu");
$("drawBtn").onclick=()=>{if(confirm("Plätze jetzt neu auslosen?"))send({op:"draw"},"Plätze auslosen");};
$("endGame").onclick=()=>send({op:"endgame"},"Minigame vorbei");
$("sendMsg").onclick=()=>{const t=$("msg").value.trim();if(!t)return;send({op:"msg",text:t,min:20},"Durchsage");$("msg").value="";};
$("addP").onclick=()=>{const n=$("newP").value.trim();if(!n)return;send({op:"add",name:n},n+" dazu");$("newP").value="";};
$("shX").onclick=()=>$("sheet").hidden=true;
function sheet(title,btns){
  $("shT").textContent=title;const B=$("shB");B.innerHTML="";
  btns.forEach(([t,cls,fn])=>{const b=document.createElement("button");b.textContent=t;if(cls)b.className=cls;b.onclick=()=>{$("sheet").hidden=true;fn();};B.appendChild(b);});
  $("sheet").hidden=false;
}
function renderPlayers(){
  const L=$("pl");L.innerHTML="";if(!st)return;
  st.p.forEach(([name,entries,out,place,open,head,bw])=>{
    const r=document.createElement("div");r.className="pr"+(out?" out":"");
    r.innerHTML='<div class="n"></div>';
    r.querySelector(".n").innerHTML='<span></span><small>'+(entries>1?"+"+(entries-1)+" Rebuy":"Buy-in")+(open?' · <b>'+open+' offen</b>':"")+(out?" · Platz "+place:"")+(st.bounty&&!out?" · 🎯 "+head+" P":"")+(st.bounty&&bw?" · kassiert "+bw+" P":"")+'</small>';
    r.querySelector(".n span").textContent=name;
    const mk=(t,cls,fn)=>{const b=document.createElement("button");b.className="sm "+(cls||"");b.textContent=t;b.onclick=fn;r.appendChild(b);};
    mk("+ Rebuy","",()=>sheet(name+": Rebuy",[["Bar bezahlt","pri",()=>send({op:"rebuy",name,paid:"bar"},name+" Rebuy bar")],["Überwiesen","",()=>send({op:"rebuy",name,paid:"dig"},name+" Rebuy überwiesen")],["Offen (zahlt später)","red",()=>send({op:"rebuy",name,paid:"offen"},name+" Rebuy offen")]]));
    if(!out)mk("Raus","red",()=>{if(!st.bounty){if(confirm(name+" ist raus?"))send({op:"out",name},name+" raus");return;}
      sheet("Wer hat "+name+" rausgeworfen?",st.p.filter(x=>!x[2]&&x[0]!==name).map(x=>[x[0]+" · 🎯 "+x[5]+" P","pri",()=>send({op:"out",name,by:x[0]},x[0]+" wirft "+name+" raus")]).concat([["Ohne Werfer (Kopf in den Pot)","",()=>send({op:"out",name},name+" raus")]]));});
    else mk("Zurück","",()=>send({op:"back",name},name+" zurück"));
    mk("⋯","",()=>sheet(name,[
      ["Buy-in offen (nicht bezahlt)","",()=>send({op:"paid",name,entry:1,paid:"offen"},"Buy-in offen")],
      ["Buy-in bar bezahlt","",()=>send({op:"paid",name,entry:1,paid:"bar"},"Buy-in bar")],
      ["Letzten Rebuy zurücknehmen","red",()=>send({op:"undo",name},"Rebuy zurück")],
      ["Dealer-Button zu "+name,"",()=>send({op:"dealer",name},"Dealer "+name)]]));
    L.appendChild(r);
  });
}
function renderGames(){
  const G=$("games");if(G.dataset.k===String(st&&st.games))return;G.dataset.k=String(st&&st.games);G.innerHTML="";
  (st?st.games:[]).forEach(g=>{const b=document.createElement("button");b.textContent=g;b.onclick=()=>send({op:"game",name:g},g);G.appendChild(b);});
}
const mmss=s=>{s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");};
function tick(){
  const d=$("dot"),fresh=Date.now()-lastAt<90000;
  d.className="dot"+(fresh?" on":"");d.querySelector("span").textContent=fresh?"Tafel verbunden":"keine Antwort von der Tafel";
  if(!st)return;
  const left=st.running&&st.localEnd?(st.localEnd-Date.now())/1000:st.left;
  $("t").textContent=mmss(left);$("t").className="t"+(st.running?"":" p");
}
function apply(s){
  if(st&&s.at&&st.at&&s.at<st.at)return;          // ignore older snapshots
  s.localEnd=s.running?Date.now()+s.left*1000:null;
  st=s;lastAt=Date.now();
  $("lvl").textContent=s.lvl;$("bl").textContent=s.blinds;
  $("meta").textContent="Pot "+s.pot+" P · "+s.entries+" Entries · "+(s.reOpen?"Rebuy offen":"Freezeout")+(s.active?" · läuft: "+s.active:"");
  $("play").textContent=s.running?"❚❚ Pause":"▶ Start";
  $("sum").textContent=s.lvl+" · "+s.blinds+(s.running?"":" · Pause");
  renderPlayers();renderGames();renderDeck();tick();
}

/* ---------- Stream Deck ---------- */
const AV={"tim":"tim","niklas":"niklas","niki":"niklas","nico":"nico","manu":"manu","domi m":"magg","magg":"magg","domi c":"domi-c","oli":"oli","olli":"oli","philipp":"philipp","jonny":"jonny","benno":"benno","chris":"chris","kevin":"kevin","jan":"jan","zeno":"zeno","pasi":"pasi"};
let CLIPS=[];
const same=(a,b)=>a.toLowerCase()===b.toLowerCase()||(AV[a.toLowerCase()]&&AV[a.toLowerCase()]===AV[b.toLowerCase()]);
function renderDeck(){
  const D=$("deck"),at=st?st.p.map(x=>x[0]):[];
  const k=JSON.stringify([CLIPS.map(c=>c.id+c.t+c.p),at]);if(D.dataset.k===k)return;D.dataset.k=k;
  if(!CLIPS.length){D.innerHTML='<p class="note">Noch keine Clips eingetragen.</p>';return;}
  const groups=[];CLIPS.forEach(c=>{let g=groups.find(g=>same(g.p,c.p));if(!g)groups.push(g={p:c.p,c:[]});g.c.push(c);});
  const here=g=>g.p==="Alle"?2:at.some(n=>same(n,g.p))?0:1;
  groups.sort((a,b)=>here(a)-here(b));
  D.innerHTML="";
  groups.forEach(g=>{
    const r=document.createElement("div");r.className="pc"+(here(g)===1&&at.length?" away":"");
    const a=AV[g.p.toLowerCase()];
    r.innerHTML='<div class="av">'+(a?'<img src="karten/av/'+a+'.jpg?v=13" alt="">':(g.p==="Alle"?"★":g.p.charAt(0)))+'</div><div><div class="nm"></div><div class="cb"></div></div>';
    r.querySelector(".nm").textContent=g.p==="Alle"?"Für alle":g.p;
    const cb=r.querySelector(".cb");
    g.c.forEach(c=>{const b=document.createElement("button");b.textContent=c.t;if(c.stumm){const s=document.createElement("small");s.textContent="ohne Ton";b.appendChild(s);}
      b.onclick=()=>{b.classList.add("hit");setTimeout(()=>b.classList.remove("hit"),600);send({op:"clip",id:c.id},"▶ "+c.t);};cb.appendChild(b);});
    D.appendChild(r);
  });
}
async function loadClips(){try{const r=await fetch("clips/clips.json?t="+Date.now(),{cache:"no-store"});const j=await r.json();CLIPS=j.clips||[];renderDeck();}catch(e){$("deck").innerHTML='<p class="note">Clips nicht geladen. Netz prüfen.</p>';}}
$("clipStop").onclick=()=>send({op:"clipstop"},"Clip gestoppt");
try{if(localStorage.getItem("bcc-handy-ctl")==="1")$("ctl").open=true;}catch(e){}
$("ctl").addEventListener("toggle",()=>{try{localStorage.setItem("bcc-handy-ctl",$("ctl").open?"1":"0");}catch(e){}});
loadClips();
// latest state: read recent cache once, then stream
async function pollState(since){
  try{const r=await fetch(RELAY+TOPIC+"-state/json?poll=1&since="+since+"&t="+Date.now(),{cache:"no-store"});const t=await r.text();const lines=t.trim().split("\n").filter(Boolean);
    for(let k=lines.length-1;k>=0;k--){const m=JSON.parse(lines[k]);if(m.event==="message"){const s=JSON.parse(m.message);
      // snapshot age: shift the clock by the time since it was sent
      const age=Math.max(0,(Date.now()-s.at)/1000);if(s.running&&age<60)s.left=Math.max(0,s.left-age);apply(s);break;}}}catch(e){}
}
let es=null;
function stream(){try{if(es)es.close();}catch(e){}es=new EventSource(RELAY+TOPIC+"-state/sse");
  es.onmessage=ev=>{try{const m=JSON.parse(ev.data);if(m.event==="message")apply(JSON.parse(m.message));}catch(e){}};}
async function load(){await pollState("12h");stream();send({op:"sync"},"Verbinde mit Tafel");}
load();setInterval(tick,500);
setInterval(()=>pollState("3m"),8000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){pollState("3m");stream();}});
</script>
</body>
</html>
