<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Blue Chip Party</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Yellowtail&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12031f; --fg:#fff6ef; --dim:#f1c9d9; --pink:#ff2e88; --pink2:#ff8ac0; --orange:#ff8a1f; --sun:#ffd35c;
  --violet:#7b2ff7; --cyan:#22e4ff; --red:#ff3b3b; --panel:rgba(18,4,32,.62); --line:rgba(255,138,192,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:Outfit,system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

/* ---------- Vice-Sunset Hintergrund ---------- */
#sky{position:fixed;inset:0;z-index:-3;background:linear-gradient(180deg,#1a0533 0%,#4a0f6b 28%,#c2187a 52%,#ff5e3a 70%,#ff9d2e 82%,#2a0838 82.2%,#12031f 100%)}
#sun{position:fixed;left:50%;top:44vh;width:46vh;height:46vh;transform:translateX(-50%);z-index:-2;border-radius:50%;
  background:linear-gradient(180deg,#fff1a8 0%,#ffd35c 35%,#ff8a1f 70%,#ff2e88 100%);
  -webkit-mask:repeating-linear-gradient(180deg,#000 0 14px,transparent 14px 20px) 0 55%/100% 100% no-repeat, linear-gradient(#000 0 55%,transparent 55%);
  -webkit-mask-composite:source-over;
  mask:linear-gradient(#000 0 55%,transparent 55%),repeating-linear-gradient(180deg,#000 0 14px,transparent 14px 20px);
  filter:drop-shadow(0 0 60px rgba(255,140,60,.8));opacity:.9}
#grid{position:fixed;left:-50%;right:-50%;bottom:0;height:18vh;z-index:-2;
  background:linear-gradient(transparent 0 0),repeating-linear-gradient(90deg,rgba(255,46,136,.55) 0 2px,transparent 2px 90px),repeating-linear-gradient(0deg,rgba(255,46,136,.55) 0 2px,transparent 2px 30px);
  transform:perspective(300px) rotateX(60deg);transform-origin:bottom;animation:gridmv 3s linear infinite;opacity:.6}
@keyframes gridmv{to{background-position:0 0,0 0,0 30px}}
.palm{position:fixed;bottom:-2vh;z-index:-1;height:62vh;fill:#0b0114;opacity:.95}
.palm.l{left:-4vw}.palm.r{right:-4vw;transform:scaleX(-1)}
#scan{position:fixed;inset:0;z-index:90;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.08) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}

/* ---------- Layout ---------- */
.wrap{height:100vh;display:grid;grid-template-rows:auto 1fr auto;gap:1.6vh;padding:2vh 2vw 1.4vh}
header{display:flex;align-items:center;justify-content:space-between;gap:2vw}
.logo{display:flex;align-items:baseline;gap:.6vw;line-height:.9}
.logo .a{font-family:Anton;font-size:clamp(30px,4.4vw,86px);letter-spacing:.02em;color:#fff;text-shadow:3px 3px 0 var(--pink),6px 6px 0 rgba(0,0,0,.5)}
.logo .b{font-family:Yellowtail;font-size:clamp(34px,4.8vw,96px);background:linear-gradient(90deg,var(--sun),var(--orange),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(255,46,136,.6));transform:rotate(-6deg) translateY(-.2em)}
.sub{font-family:Anton;letter-spacing:.3em;font-size:clamp(11px,1vw,19px);color:var(--pink2);margin-top:.6vh}
.hr{display:flex;gap:1.2vw;align-items:center}
.chip{font-family:Anton;letter-spacing:.08em;font-size:clamp(13px,1.3vw,25px);padding:.5vh 1vw;background:rgba(0,0,0,.45);border:2px solid var(--pink);clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.chip.c{border-color:var(--cyan);color:var(--cyan)}
.chip.g{border-color:var(--sun);color:var(--sun)}
#conn{width:12px;height:12px;border-radius:50%;background:#777;box-shadow:0 0 8px currentColor}
#conn.ok{background:#43ff8b}

main{display:grid;grid-template-columns:1.05fr 1.25fr 1fr;gap:1.6vw;min-height:0}
.pn{background:var(--panel);border:2px solid var(--line);position:relative;overflow:hidden;
  clip-path:polygon(0 0,calc(100% - 26px) 0,100% 26px,100% 100%,26px 100%,0 calc(100% - 26px))}
.pn h3{font-family:Anton;font-weight:400;letter-spacing:.18em;font-size:clamp(12px,1.05vw,20px);color:var(--pink2)}

/* Foto */
.photo{padding:0}
.photo .im{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.4s;animation:kb 14s ease-in-out infinite alternate}
.photo .im.on{opacity:1}
@keyframes kb{from{transform:scale(1.03)}to{transform:scale(1.14) translate(-2%,-1%)}}
.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(18,3,31,.92));pointer-events:none}
.photo .cap{position:absolute;left:1.4vw;right:1.4vw;bottom:2vh;z-index:2}
.photo .cap b{display:block;font-family:Anton;font-size:clamp(24px,2.6vw,52px);letter-spacing:.03em;text-shadow:3px 3px 0 var(--pink)}
.photo .cap span{font-family:Yellowtail;font-size:clamp(22px,2.2vw,44px);color:var(--sun)}

/* Uhr */
.clock{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2vh 1vw}
.lvl{font-family:Anton;font-size:clamp(20px,2.2vw,44px);letter-spacing:.14em;color:var(--sun)}
.time{font-family:Anton;font-size:clamp(80px,10.5vw,210px);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.02em;
  color:#fff;text-shadow:4px 4px 0 var(--pink),8px 8px 0 rgba(0,0,0,.45)}
.time.paused{animation:blink 1.4s steps(2) infinite}
.time.warn{color:var(--sun)}
@keyframes blink{50%{opacity:.35}}
.bl{font-family:Anton;font-size:clamp(40px,4.8vw,96px);line-height:1;margin-top:1vh}
.bl small{display:block;font-family:Anton;font-size:clamp(12px,1vw,19px);letter-spacing:.3em;color:var(--pink2);margin-bottom:.5vh}
.ante{color:var(--cyan);font-weight:800;font-size:clamp(14px,1.4vw,27px);margin-top:.6vh;min-height:1.2em}
.nx{margin-top:1.4vh;color:var(--dim);font-size:clamp(14px,1.3vw,25px)}
.nx b{color:#fff}
.evbox{margin-top:2.2vh;display:flex;align-items:center;gap:1vw;padding:1vh 1.4vw;background:rgba(0,0,0,.4);border-left:4px solid var(--cyan)}
.evbox .k{font-family:Anton;letter-spacing:.16em;font-size:clamp(11px,.9vw,17px);color:var(--cyan)}
.evbox .v{font-family:Anton;font-size:clamp(22px,2.2vw,44px)}
.bar{position:absolute;left:0;bottom:0;height:7px;background:linear-gradient(90deg,var(--pink),var(--orange),var(--sun));transition:width 1s linear}
.startat{font-family:Yellowtail;color:var(--sun);font-size:clamp(22px,2vw,40px);margin-top:.6vh;min-height:1.2em}

/* rechts */
.side{display:grid;grid-template-rows:auto 1fr;gap:1.6vh;min-height:0}
.pot{padding:1.6vh 1.4vw}
.pot .v{font-family:Anton;font-size:clamp(46px,4.6vw,92px);line-height:1;color:var(--sun);text-shadow:3px 3px 0 var(--pink)}
.pot .v.pop{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.12)}}
.pot .r{color:var(--dim);font-size:clamp(12px,1vw,19px);margin-top:.6vh}
.pot .pay{display:flex;gap:1vw;margin-top:1vh;font-family:Anton;font-size:clamp(16px,1.6vw,31px);letter-spacing:.03em}
.seats{padding:1.4vh 1.2vw;display:flex;flex-direction:column;min-height:0}
.seats ul{list-style:none;display:flex;flex-direction:column;gap:.6vh;margin-top:1vh;flex:1;min-height:0}
.seats li{display:flex;align-items:center;gap:.8vw;padding:.45vh .8vw;background:rgba(0,0,0,.35);font-size:clamp(13px,1.25vw,24px);font-weight:600;flex:1;max-height:6vh;
  clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.seats li .s{font-family:Anton;color:var(--pink2);width:1.8em;text-align:center}
.seats li .n{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seats li .st{color:var(--sun);letter-spacing:-.05em;font-size:.9em}
.seats li.out{opacity:.45;text-decoration:line-through}
.seats li.out .st{text-decoration:none}
.seats li.empty{opacity:.3;font-weight:400}
.seats li.alex .n{color:var(--sun)}

.ticker{overflow:hidden;white-space:nowrap;background:rgba(0,0,0,.55);border-top:2px solid var(--pink);border-bottom:2px solid var(--pink);padding:.6vh 0;font-family:Anton;letter-spacing:.1em;font-size:clamp(13px,1.2vw,23px)}
.ticker span{display:inline-block;padding-left:100%;animation:tk 50s linear infinite}
@keyframes tk{to{transform:translateX(-100%)}}

/* ---------- Overlays ---------- */
.ov{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:4vh 5vw}
.ov.on{display:flex}
#ev{background:#12031f radial-gradient(70% 70% at 50% 50%,#4a0f6b,#0a0114)}
#ev .bgimg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.22;filter:saturate(1.3)}
#ev > *:not(.bgimg){position:relative}
#ev .tag{font-family:Anton;letter-spacing:.3em;font-size:clamp(18px,2vw,40px);color:var(--sun)}
.reel{height:clamp(120px,16vw,300px);overflow:hidden;margin:2.6vh 0;width:min(1400px,92vw);border-top:4px solid var(--pink);border-bottom:4px solid var(--pink);
  -webkit-mask-image:linear-gradient(transparent,#000 22%,#000 78%,transparent);mask-image:linear-gradient(transparent,#000 22%,#000 78%,transparent)}
.reel .it{height:clamp(120px,16vw,300px);display:flex;align-items:center;justify-content:center;gap:2vw;font-family:Anton;font-size:clamp(34px,6vw,120px);letter-spacing:.03em;text-shadow:4px 4px 0 var(--pink)}
#evDesc{font-size:clamp(20px,2.4vw,48px);font-weight:600;max-width:1300px;line-height:1.3;opacity:0;transform:translateY(20px);transition:.6s}
#evDesc.show{opacity:1;transform:none}
#evDesc .who{color:var(--sun);font-weight:800}
.kind{display:inline-block;margin-bottom:2vh;padding:.5vh 1.4vw;font-family:Anton;letter-spacing:.2em;font-size:clamp(13px,1.2vw,22px);background:var(--pink);clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.kind.party{background:var(--cyan);color:#120320}
.kind.fp{background:var(--red)}
#evHint{margin-top:3vh;color:var(--dim);font-size:clamp(13px,1.1vw,20px);opacity:0;transition:.5s .4s}
#evHint.show{opacity:.8}

#fx{pointer-events:none;background:transparent;z-index:60}
#fx .big{font-family:Anton;font-size:clamp(70px,12vw,240px);letter-spacing:.04em;line-height:1;animation:fxin 3.4s ease forwards}
#fx .small{font-family:Anton;font-size:clamp(22px,2.6vw,52px);letter-spacing:.1em;margin-top:1vh;animation:fxin 3.4s ease forwards}
#fx.wasted{background:rgba(60,0,0,.55);backdrop-filter:grayscale(1)}
#fx.wasted .big{color:var(--red);text-shadow:4px 4px 0 #000}
#fx.respawn{background:rgba(0,30,60,.45)}
#fx.respawn .big{color:var(--cyan);text-shadow:4px 4px 0 #000}
#fx.passed{background:rgba(40,20,0,.4)}
#fx.passed .big{color:var(--sun);text-shadow:4px 4px 0 var(--pink)}
#fx.level .big{color:#fff;text-shadow:4px 4px 0 var(--pink)}
#fx.level{background:rgba(18,3,31,.55)}
@keyframes fxin{0%{opacity:0;transform:scale(1.4)}12%{opacity:1;transform:scale(1)}85%{opacity:1}100%{opacity:0}}

#show{z-index:55;background:#000;padding:0}
#show .im{position:absolute;inset:0;background-size:cover;background-position:center;animation:kb 9s ease-out forwards}
#show .cap{position:absolute;left:5vw;bottom:8vh;text-align:left}
#show .cap b{display:block;font-family:Anton;font-size:clamp(40px,6vw,120px);text-shadow:5px 5px 0 var(--pink)}
#show .cap span{font-family:Yellowtail;font-size:clamp(30px,3.6vw,72px);color:var(--sun)}
#show::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.7),transparent 60%)}
#show .cap{z-index:2}

/* Laptop-Leiste */
#ctl{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;z-index:70;
  background:rgba(18,3,31,.94);border:2px solid var(--pink);padding:10px;transition:opacity .3s;max-width:calc(100vw - 24px)}
#ctl.hide{opacity:0;pointer-events:none}
#ctl button{background:rgba(255,255,255,.08);padding:9px 14px;font-weight:700;border:1px solid rgba(255,255,255,.15)}
#ctl button.hot{background:var(--pink);border-color:var(--pink)}
#ctl a{color:var(--cyan);padding:9px 6px;font-weight:700;text-decoration:none}
#toast{position:fixed;top:2vh;left:50%;transform:translate(-50%,-150%);background:var(--pink);padding:1vh 1.6vw;font-family:Anton;letter-spacing:.06em;z-index:95;transition:.4s;font-size:clamp(15px,1.4vw,26px);clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
#toast.on{transform:translate(-50%,0)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:80}

@media (max-width:900px){
  body{overflow:auto}
  .wrap{height:auto;min-height:100vh;padding:14px 16px 90px}
  main{grid-template-columns:1fr}
  .photo{height:40vh}
  .seats li{max-height:none;padding:6px 10px}
  header{flex-wrap:wrap}
}
</style>
</head>
<body>
<div id="sky"></div><div id="sun"></div><div id="grid"></div>
<svg class="palm l" viewBox="0 0 300 600" aria-hidden="true"><path d="M150 600 C150 450 160 330 175 230 L183 230 C170 330 162 450 166 600Z"/><path d="M178 232 C130 170 60 160 0 190 C60 150 140 150 178 220Z"/><path d="M178 232 C150 150 100 100 30 90 C110 70 170 120 182 222Z"/><path d="M180 228 C200 150 250 110 300 110 C250 140 210 180 186 232Z"/><path d="M180 230 C230 190 290 200 300 250 C260 220 220 220 184 236Z"/><path d="M178 230 C120 220 70 250 50 300 C90 250 140 238 180 238Z"/><path d="M180 226 C190 160 180 90 150 40 C200 90 205 170 186 230Z"/></svg>
<svg class="palm r" viewBox="0 0 300 600" aria-hidden="true"><path d="M150 600 C150 450 160 330 175 230 L183 230 C170 330 162 450 166 600Z"/><path d="M178 232 C130 170 60 160 0 190 C60 150 140 150 178 220Z"/><path d="M178 232 C150 150 100 100 30 90 C110 70 170 120 182 222Z"/><path d="M180 228 C200 150 250 110 300 110 C250 140 210 180 186 232Z"/><path d="M180 230 C230 190 290 200 300 250 C260 220 220 220 184 236Z"/><path d="M178 230 C120 220 70 250 50 300 C90 250 140 238 180 238Z"/></svg>
<div id="scan"></div>
<canvas id="confetti"></canvas>

<div class="wrap">
  <header>
    <div>
      <div class="logo"><span class="a" id="ttl">BLUE CHIP</span><span class="b">Party</span></div>
      <div class="sub" id="subt">ALEX' BIRTHDAY EDITION</div>
    </div>
    <div class="hr">
      <div class="chip c" id="hPl">0 / 10 SPIELER</div>
      <div class="chip g" id="hRb">REBUY OFFEN</div>
      <div class="chip" id="hClock">--:--</div>
      <span id="conn" title="Fernbedienung"></span>
    </div>
  </header>

  <main>
    <section class="pn photo" id="photo"><div class="cap"><b id="pcB">HAPPY BIRTHDAY</b><span id="pcS">Alex</span></div></section>

    <section class="pn clock">
      <div class="lvl" id="lvl">LEVEL 1</div>
      <div class="time paused" id="time">20:00</div>
      <div class="startat" id="startat"></div>
      <div class="bl"><small>BLINDS</small><span id="bl">100 / 100</span></div>
      <div class="ante" id="ante"></div>
      <div class="nx" id="nx"></div>
      <div class="evbox"><div style="font-size:clamp(26px,2.4vw,48px)">🎰</div><div><div class="k">NÄCHSTE MISSION</div><div class="v" id="evc">–</div></div></div>
      <div class="bar" id="bar"></div>
    </section>

    <section class="side">
      <div class="pn pot">
        <h3>PREISGELD</h3>
        <div class="v" id="potv">50 P</div>
        <div class="r" id="potr"></div>
        <div class="pay" id="pay"></div>
      </div>
      <div class="pn seats">
        <h3>DIE CREW</h3>
        <ul id="seats"></ul>
      </div>
    </section>
  </main>

  <div class="ticker"><span id="tick"></span></div>
</div>

<div class="ov" id="ev">
  <div class="bgimg" id="evBg"></div>
  <div class="tag" id="evTag">★ NEUE MISSION ★</div>
  <div class="reel"><div id="strip"></div></div>
  <div id="evDesc"></div>
  <div id="evHint">Fernbedienung oder Leertaste: Mission erledigt</div>
</div>
<div class="ov" id="show"><div class="im" id="showIm"></div><div class="cap"><b id="showB"></b><span id="showS"></span></div></div>
<div class="ov" id="fx"><div class="big" id="fxB"></div><div class="small" id="fxS"></div></div>

<div id="ctl">
  <button class="hot" id="bPlay">▶ Start</button>
  <button id="bEv">🎰 Mission jetzt</button>
  <button id="bDone">✓ Mission erledigt</button>
  <button id="bPh">📸 Alex-Foto</button>
  <button id="bFs">⛶ Vollbild</button>
  <a href="fb.html" target="_blank" rel="noopener">📱 Fernbedienung</a>
</div>
<div id="toast"></div>

<script src="core.js"></script>
<script>
(function(){
"use strict";
var P=window.PARTY, $=function(i){return document.getElementById(i)}, num=P.num, fmt=P.fmt, esc=P.esc;
var S=load();
function load(){
  var s=null; try{ s=JSON.parse(localStorage.getItem(P.KEY)||"null"); }catch(e){}
  var o=P.defaults(); if(s&&s.v===1) for(var k in s) o[k]=s[k];
  return o;
}
function save(){ try{ localStorage.setItem(P.KEY,JSON.stringify(S)); }catch(e){} }
var lv=function(i){return S.levels[i]};

/* ---------- Uhr ---------- */
function curLeft(){ return S.running? (S.endsAt-Date.now())/1000 : S.left; }
function curEv(){ return S.running? (S.evAt-Date.now())/1000 : S.evLeft; }
function setRun(r){
  if(r===S.running) return;
  if(r){ S.endsAt=Date.now()+S.left*1000; S.evAt=Date.now()+S.evLeft*1000; }
  else { S.left=Math.max(0,curLeft()); S.evLeft=Math.max(0,curEv()); }
  S.running=r;
}
function rollEv(){ var a=Math.min(S.evMin,S.evMax), b=Math.max(S.evMin,S.evMax); S.evLeft=(a+Math.random()*(b-a))*60; S.evAt=Date.now()+S.evLeft*1000; }
function goLevel(i,quiet){
  i=Math.max(0,Math.min(S.levels.length-1,i));
  var r=S.running; setRun(false); var wasOpen=P.rebuyOpen(S);
  S.li=i; S.left=P.lvlLen(S,i); setRun(r);
  if(!quiet) levelFx(wasOpen);
}
function levelFx(wasOpen){
  var l=lv(S.li);
  if(l.brk) fx("level","PAUSE",l.brk+" MINUTEN CHILLEN");
  else fx("level","LEVEL "+P.playNo(S,S.li),num(l.sb)+" / "+num(l.bb)+(l.a?" · ANTE "+num(l.a):""));
  sfx("level");
  if(wasOpen&&!P.rebuyOpen(S)) setTimeout(function(){ toast("🔒 Rebuy-Phase vorbei"); },3600);
}

/* ---------- Spieler ---------- */
function byId(id){ for(var i=0;i<S.players.length;i++) if(S.players[i].id===id) return S.players[i]; return null; }
function seatHolder(s){ var ro=P.rebuyOpen(S); for(var i=0;i<S.players.length;i++){ var p=S.players[i]; if(p.seat===s&&(!p.out||ro)) return p; } return null; }
function freeSeat(){ for(var s=1;s<=S.seats;s++) if(!seatHolder(s)) return s; return 0; }
function snap(label){ S.log.push({l:label,pl:JSON.stringify(S.players),n:S.nextId}); if(S.log.length>30) S.log.shift(); }
function uniqName(n){ n=String(n||"").trim().slice(0,24)||"Spieler"; var base=n,k=2; while(S.players.some(function(p){return p.name.toLowerCase()===n.toLowerCase()})) n=base+" "+(k++); return n; }

/* ---------- Ops (von Fernbedienung oder Laptop) ---------- */
var seen={};
function op(o){
  if(o._id){ if(seen[o._id]) return ack(o._id,true); seen[o._id]=1; }
  var msg=null, p=o.id!=null? byId(o.id):null;
  switch(o.op){
    case "play": setRun(true); break;
    case "pause": setRun(false); break;
    case "toggle": setRun(!S.running); break;
    case "lvl": goLevel(S.li+(o.d||1), o.d<0); break;
    case "time": { var r=S.running; setRun(false); S.left=Math.max(5,Math.min(P.lvlLen(S,S.li)*3,S.left+(o.d||0))); setRun(r); break; }
    case "ev": if(!S.ev) startEvent(); else msg="Mission läuft schon"; break;
    case "fullport": if(!S.ev){ startEvent(P.FULLPORT); } break;
    case "evdone": doneEvent(); break;
    case "evagain": if(S.ev){ var keep=S.ev.resume; undoPlayed(); S.ev=null; startEvent(null,keep); } break;
    case "add": {
      if(S.players.filter(function(x){return !x.out||P.rebuyOpen(S)}).length>=S.seats && !o.seat){ msg="Tisch ist voll"; break; }
      var seat=o.seat&&!seatHolder(o.seat)? o.seat : freeSeat(); if(!seat){ msg="Kein Platz frei"; break; }
      S.players.forEach(function(x){ if(x.seat===seat&&x.out) x.seat=0; });
      snap("Neuer Spieler"); var np={id:S.nextId++,name:uniqName(o.name),seat:seat,buys:1,out:false,outTs:0};
      S.players.push(np); potPop(); toast("+ "+np.name+" (Platz "+seat+")"); sfx("chip"); break; }
    case "out": if(p&&!p.out){ snap(p.name+" raus"); p.out=true; p.outTs=Date.now();
        var al=P.alive(S); fx("wasted","WASTED",p.name.toUpperCase()+(al.length===1?" · "+al[0].name.toUpperCase()+" GEWINNT!":"")); sfx("wasted");
        if(al.length===1) setTimeout(function(){ fx("passed","CHAMPION",al[0].name.toUpperCase()); confetti(); sfx("tada"); },3600);
      } break;
    case "back": if(p&&p.out){ snap(p.name+" doch nicht raus"); p.out=false; p.outTs=0; if(!p.seat||seatHolder(p.seat)&&seatHolder(p.seat)!==p) p.seat=freeSeat(); toast(p.name+" ist wieder drin"); } break;
    case "rebuy": if(p){ if(!P.rebuyOpen(S)&&!o.force){ msg="Rebuy-Phase ist vorbei"; break; }
        snap(p.name+" Rebuy"); p.buys++; p.out=false; p.outTs=0; if(!p.seat||(seatHolder(p.seat)&&seatHolder(p.seat)!==p)) p.seat=freeSeat();
        potPop(); fx("respawn","REBUY",p.name.toUpperCase()+" IST ZURÜCK"); sfx("chip"); } break;
    case "unbuy": if(p&&p.buys>1){ snap(p.name+" Rebuy weg"); p.buys--; toast("Rebuy von "+p.name+" zurückgenommen"); } break;
    case "rename": if(p&&o.name){ snap("Umbenannt"); var old=p.name; p.name=""; p.name=uniqName(o.name); toast(old+" → "+p.name); } break;
    case "seat": if(p&&o.seat>=1&&o.seat<=S.seats){ snap("Platz geändert"); var h=seatHolder(o.seat); if(h&&h!==p){ h.seat=p.seat; } p.seat=o.seat; toast(p.name+" → Platz "+o.seat); } break;
    case "del": if(p){ snap(p.name+" gelöscht"); S.players=S.players.filter(function(x){return x!==p}); toast(p.name+" entfernt"); } break;
    case "draw": drawSeats(); break;
    case "undo": { var L=S.log.pop(); if(L){ S.players=JSON.parse(L.pl); S.nextId=L.n; toast("↶ Rückgängig: "+L.l); } else msg="Nichts zum Zurücknehmen"; break; }
    case "photo": showPhoto(); break;
    case "set": {
      var allow={entry:1,rebuy:1,bonus:1,unit:1,rebuyLvl:1,min:1,evMin:1,evMax:1,auto:1,pauseParty:1,title:1,sub:1,start:1,stack:1};
      if(allow[o.k]){ var v=o.v; if(typeof DEF_NUM[o.k]==="number"){ v=parseFloat(v); if(isNaN(v)||v<0) break; }
        if(o.k==="min"){ var r2=S.running; setRun(false); if(!lv(S.li).brk) S.left=Math.max(5,S.left+(v-S.min)*60); S.min=v; setRun(r2); }
        else S[o.k]=v;
        if(o.k==="evMin"||o.k==="evMax"||o.k==="auto"){ var r3=S.running; setRun(false); rollEv(); setRun(r3); }
        ticker(); }

    case "evtoggle": if(o.id){ if(S.off[o.id]) delete S.off[o.id]; else S.off[o.id]=1; } break;
    case "lvlset": if(o.i>=0&&o.i<S.levels.length&&o.l){ S.levels[o.i]=o.l; } break;
    case "reset": { var keep2={}; ["title","sub","start","entry","rebuy","bonus","unit","stack","rebuyLvl","min","evMin","evMax","auto","pauseParty","off","levels"].forEach(function(k){keep2[k]=S[k]});
        var pl=o.keepPlayers? S.players.map(function(x){return {id:x.id,name:x.name,seat:x.seat,buys:1,out:false,outTs:0}}) : [];
        S=P.defaults(); for(var k in keep2) S[k]=keep2[k]; S.players=pl; S.nextId=pl.reduce(function(a,x){return Math.max(a,x.id+1)},1); S.left=P.lvlLen(S,0); rollEv(); toast("Neues Turnier bereit"); break; }
  }
  save(); render(); broadcast();
  if(o._id) ack(o._id,false,msg);
  else if(msg) toast(msg);
}
var DEF_NUM=P.defaults();
function potPop(){ var v=$("potv"); v.classList.remove("pop"); void v.offsetWidth; v.classList.add("pop"); }
function drawSeats(){
  var act=S.players.filter(function(p){return !p.out});
  if(!act.length){ toast("Noch keine Spieler"); return; }
  snap("Plätze ausgelost");
  var seats=[]; for(var s=1;s<=S.seats;s++) seats.push(s);
  var tim=act.filter(function(p){return p.name.toLowerCase()==="tim"})[0];
  if(tim){ tim.seat=S.seats; seats.pop(); }
  for(var i=seats.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=seats[i]; seats[i]=seats[j]; seats[j]=t; }
  act.filter(function(p){return p!==tim}).forEach(function(p,i){ p.seat=seats[i]||0; });
  S.players.forEach(function(p){ if(p.out) p.seat=0; });
  fx("level","PLÄTZE","NEU AUSGELOST"); sfx("level");
}

/* ---------- Missionen ---------- */
function active(){ return P.EVENTS.filter(function(e){return !S.off[e.id]}); }
function pick(){
  var a=active(); if(!a.length) return null;
  var last=S.hist.length? S.hist[S.hist.length-1].id : null;
  var w=a.map(function(e){ return (e.id===last?0.05:1)/(1+(S.played[e.id]||0)*1.5); });
  var sum=w.reduce(function(x,y){return x+y},0), r=Math.random()*sum;
  for(var i=0;i<a.length;i++){ r-=w[i]; if(r<=0) return a[i]; } return a[a.length-1];
}
function fillWho(d){
  var names=P.alive(S).map(function(p){return p.name}); if(names.length<2) names=names.concat(["Spieler A","Spieler B","Spieler C","Spieler D"]);
  for(var i=names.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=names[i]; names[i]=names[j]; names[j]=t; }
  return d.replace(/\{(\d)\}/g,function(_,n){ return "\u0001"+(names[(+n-1)%names.length])+"\u0002"; });
}
function startEvent(force,keepResume){
  var e=force||pick(); if(!e){ toast("Keine Missionen aktiv"); return; }
  var resume=keepResume!=null? keepResume : false;
  if(keepResume==null && S.running && e.k==="party" && S.pauseParty){ setRun(false); resume=true; }
  var a=active(), seq=[]; for(var i=0;i<26;i++) seq.push(a.length? a[Math.floor(Math.random()*a.length)].id : e.id);
  S.ev={id:e.id,e:e.e,t:e.t,k:e.k,d:fillWho(e.d),ts:Date.now(),seq:seq,resume:resume,img:P.IMGS[Math.floor(Math.random()*P.IMGS.length)]};
  if(e.id==="fullport") S.fp.done=true;
  S.played[e.id]=(S.played[e.id]||0)+1;
  var d=new Date(); S.hist.push({id:e.id,e:e.e,t:e.t,at:(d.getHours()<10?"0":"")+d.getHours()+":"+(d.getMinutes()<10?"0":"")+d.getMinutes()});
  shownEv=null; save(); render(); broadcast();
}
function undoPlayed(){ if(!S.ev) return; S.played[S.ev.id]=Math.max(0,(S.played[S.ev.id]||1)-1); S.hist.pop(); if(S.ev.id==="fullport") S.fp.done=false; }
function doneEvent(){
  if(!S.ev) return; var r=S.ev.resume; S.ev=null;
  var run=S.running; setRun(false); rollEv(); if(r) run=true; setRun(run);
  fx("passed","MISSION PASSED","RESPECT +"+(50+Math.floor(Math.random()*9)*25)); sfx("tada");
}
var shownEv=null;
function renderEvent(){
  var o=$("ev");
  if(!S.ev){ o.classList.remove("on"); shownEv=null; return; }
  if(shownEv===S.ev.ts) return; shownEv=S.ev.ts;
  var ev=S.ev, all=P.EVENTS.concat([P.FULLPORT]), byid={}; all.forEach(function(x){byid[x.id]=x});
  o.classList.add("on"); $("evBg").style.backgroundImage="url("+ev.img+")";
  $("evDesc").classList.remove("show"); $("evHint").classList.remove("show");
  $("evTag").textContent= ev.id==="fullport"? "★★★★★ SONDERMISSION ★★★★★" : "★ NEUE MISSION ★";
  var strip=$("strip"); strip.innerHTML="";
  var seq=ev.seq.concat([ev.id]);
  seq.forEach(function(id,i){ var x=i===seq.length-1? ev : (byid[id]||ev); var d=document.createElement("div"); d.className="it"; d.innerHTML="<span></span><span></span>"; d.children[0].textContent=x.e; d.children[1].textContent=x.t; strip.appendChild(d); });
  var h=strip.firstChild.getBoundingClientRect().height, age=Date.now()-ev.ts, dur=Math.max(0,4200-age);
  strip.style.transition="none"; strip.style.transform="translateY(0)"; void strip.offsetWidth;
  strip.style.transition="transform "+dur+"ms cubic-bezier(.12,.7,.18,1)"; strip.style.transform="translateY(-"+(h*(seq.length-1))+"px)";
  if(dur>500) sfx("spin");
  var ts=ev.ts;
  setTimeout(function(){
    if(!S.ev||S.ev.ts!==ts) return;
    var dd=$("evDesc"); dd.innerHTML="";
    var k=document.createElement("span"); k.className="kind "+(ev.id==="fullport"?"fp":ev.k); k.textContent= ev.id==="fullport"? "ALLE ALL-IN · NUR EINMAL" : ev.k==="party"? "PARTY-GAME" : "POKER-RUNDE";
    dd.appendChild(k); dd.appendChild(document.createElement("br"));
    ev.d.split(/(\u0001[^\u0002]*\u0002)/).forEach(function(part){
      if(part.charAt(0)==="\u0001"){ var s=document.createElement("span"); s.className="who"; s.textContent=part.slice(1,-1); dd.appendChild(s); }
      else dd.appendChild(document.createTextNode(part));
    });
    dd.classList.add("show"); $("evHint").classList.add("show");
    if(dur>500){ confetti(); sfx("tada"); }
  },dur+150);
}

/* ---------- Fotos ---------- */
var CAPS=[["HAPPY BIRTHDAY","Alex"],["DER FULLPORT-EXPERTE","all-in ohne Angst"],["GEBURTSTAGSKIND","heute gewinnt er alles"],["WANTED ★★★★★","für zu viele All-ins"],["THE MAN IN WHITE","Alex"],["RESPECT +1000","Alex"],["MISSION: GEBURTSTAG","Level 1 startet"],["VICE CITY VIBES","Blue Chip Party"]];
var phIdx=0, phEls=[];
(function(){ var ph=$("photo"); P.IMGS.forEach(function(src,i){ var d=document.createElement("div"); d.className="im"+(i===0?" on":""); d.style.backgroundImage="url("+src+")"; d.style.animationDelay=(-i*3)+"s"; ph.insertBefore(d,ph.firstChild); phEls.push(d); }); })();
function nextPhoto(){ phEls[phIdx].classList.remove("on"); phIdx=(phIdx+1)%phEls.length; phEls[phIdx].classList.add("on"); var c=CAPS[phIdx%CAPS.length]; $("pcB").textContent=c[0]; $("pcS").textContent=c[1]; }
setInterval(nextPhoto,11000);
var showT=null, lastShow=Date.now();
function showPhoto(){
  if(S.ev) return; var i=Math.floor(Math.random()*P.IMGS.length), c=CAPS[Math.floor(Math.random()*CAPS.length)];
  var im=$("showIm"); im.style.animation="none"; void im.offsetWidth; im.style.animation=""; im.style.backgroundImage="url("+P.IMGS[i]+")";
  $("showB").textContent=c[0]; $("showS").textContent=c[1]; $("show").classList.add("on"); lastShow=Date.now();
  clearTimeout(showT); showT=setTimeout(function(){ $("show").classList.remove("on"); },8000);
}

/* ---------- Render ---------- */
function render(){
  $("ttl").textContent=S.title.replace(/\s*PARTY\s*$/i,"")||"BLUE CHIP"; $("subt").textContent=String(S.sub).toUpperCase();
  var l=lv(S.li), left=curLeft(), t=$("time");
  t.textContent=fmt(left); t.classList.toggle("paused",!S.running); t.classList.toggle("warn",S.running&&left<=60);
  if(l.brk){ $("lvl").textContent="PAUSE"; $("bl").textContent="CHILL & DRINKS"; $("ante").textContent=""; }
  else { $("lvl").textContent="LEVEL "+P.playNo(S,S.li); $("bl").textContent=num(l.sb)+" / "+num(l.bb); $("ante").textContent=l.a? "BIG BLIND ANTE "+num(l.a):""; }
  var nx=lv(S.li+1);
  $("nx").innerHTML= nx? (nx.brk? "Danach: <b>Pause ("+nx.brk+" Min)</b>" : "Nächstes Level: <b>"+num(nx.sb)+" / "+num(nx.bb)+"</b>") : "Letztes Level";
  $("bar").style.width=(100-100*left/P.lvlLen(S,S.li))+"%";
  var fresh=!S.running&&S.li===0&&Math.abs(S.left-P.lvlLen(S,0))<2&&!S.hist.length;
  $("startat").textContent= fresh? "Start um "+S.start+" Uhr · "+num(S.stack)+" Chips" : "";
  $("evc").textContent= !S.auto? "per Knopf" : l.brk? "nach der Pause" : fmt(curEv())+(S.running?"":" ⏸");
  var ro=P.rebuyOpen(S);
  $("hRb").textContent= ro? "REBUY BIS LEVEL "+S.rebuyLvl : "REBUY ZU"; $("hRb").style.opacity= ro?1:.5;
  var al=P.alive(S).length;
  $("hPl").textContent= al+" / "+S.players.length+" IM SPIEL";
  $("potv").textContent=num(P.pot(S))+" "+S.unit;
  $("potr").textContent=P.entries(S)+" Entries · "+P.rebuys(S)+" Rebuys · Alex legt "+S.bonus+" "+S.unit+" drauf";
  var po=P.payout(S), md=["1.","2.","3."];
  $("pay").innerHTML= S.players.length? po.map(function(v,i){return "<span>"+md[i]+" "+num(v)+" "+esc(S.unit)+"</span>"}).join("") : "<span>ENTRY "+S.entry+" "+esc(S.unit)+"</span>";
  $("bPlay").textContent= S.running? "⏸ Pause" : "▶ Start";
  var ul=$("seats"), h="";
  for(var s=1;s<=S.seats;s++){
    var p=seatHolder(s);
    if(!p){ h+='<li class="empty"><span class="s">'+s+'</span><span class="n">frei</span></li>'; continue; }
    var st=""; for(var k=1;k<p.buys&&k<=6;k++) st+="★"; if(p.buys>7) st+="+"+(p.buys-7);
    h+='<li class="'+(p.out?"out ":"")+(/^alex/i.test(p.name)?"alex":"")+'"><span class="s">'+s+'</span><span class="n">'+esc(p.name)+(/^alex/i.test(p.name)?" 🎂":"")+'</span><span class="st">'+st+'</span></li>';
  }
  if(ul.innerHTML!==h) ul.innerHTML=h;
  renderEvent();
}
function ticker(){
  $("tick").textContent=["★ HAPPY BIRTHDAY ALEX ★","ENTRY "+S.entry+" "+S.unit+" · REBUY "+S.rebuy+" "+S.unit+" · ALEX LEGT "+S.bonus+" "+S.unit+" IN DEN POT",
    num(S.stack)+" CHIPS · "+S.min+"-MINUTEN-LEVEL","JEDERZEIT KANN EINE MISSION KOMMEN","EINMAL HEUTE KOMMT DIE FULLPORT-RUNDE 🚀","REBUY OFFEN BIS ENDE LEVEL "+S.rebuyLvl,"★ = REBUYS · WANTED-LEVEL"].join("        ✦        ");
}

/* ---------- Loop ---------- */
var lastBeep=-1;
function loop(){
  var d=new Date(); $("hClock").textContent=(d.getHours()<10?"0":"")+d.getHours()+":"+(d.getMinutes()<10?"0":"")+d.getMinutes();
  if(S.running){
    var cl=curLeft();
    if(cl<=0){
      if(S.li<S.levels.length-1){ var wasOpen=P.rebuyOpen(S); var over=-cl; S.li++; S.left=Math.max(1,P.lvlLen(S,S.li)-over); S.endsAt=Date.now()+S.left*1000;
        if(lv(S.li).brk){ S.evLeft=Math.max(S.evLeft,0); } levelFx(wasOpen); save(); broadcast(); }
      else { S.left=0; S.running=false; save(); broadcast(); }
    }
    var l=lv(S.li);
    if(!S.ev&&!l.brk){
      var pn=P.playNo(S,S.li), frac=1-curLeft()/P.lvlLen(S,S.li);
      if(!S.fp.done&&P.rebuyOpen(S)&&((pn===S.fp.lvl&&frac>=S.fp.frac)||pn>S.fp.lvl)) startEvent(P.FULLPORT);
      else if(S.auto&&curEv()<=0) startEvent();
    }
    if(l.brk&&curEv()<60){ S.evAt=Date.now()+60000; }
    cl=curLeft(); if(cl<=10&&cl>0&&Math.ceil(cl)!==lastBeep){ lastBeep=Math.ceil(cl); sfx("beep"); }
    if(!S.ev&&Date.now()-lastShow>9*60*1000) showPhoto();
  }
  render();
}

/* ---------- Effekte ---------- */
var tt; function toast(m){ var t=$("toast"); t.textContent=m; t.classList.add("on"); clearTimeout(tt); tt=setTimeout(function(){t.classList.remove("on")},3000); }
var fxT; function fx(cls,big,small){ var o=$("fx"); o.className="ov on "+cls; var b=$("fxB"), s=$("fxS"); b.textContent=big; s.textContent=small||""; [b,s].forEach(function(e){ e.style.animation="none"; void e.offsetWidth; e.style.animation=""; }); clearTimeout(fxT); fxT=setTimeout(function(){ o.className="ov"; },3400); }
var cv=$("confetti"), cx=cv.getContext("2d"), parts=[], anim=null;
function confetti(){ cv.width=innerWidth; cv.height=innerHeight; var cols=["#ff2e88","#ffd35c","#22e4ff","#ff8a1f","#ffffff","#7b2ff7"];
  for(var i=0;i<240;i++) parts.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,r:Math.random()*6.3,vr:(Math.random()-.5)*.3,s:6+Math.random()*9,c:cols[i%cols.length]});
  if(!anim) anim=requestAnimationFrame(dc); }
function dc(){ cx.clearRect(0,0,cv.width,cv.height); parts=parts.filter(function(p){return p.y<cv.height+30});
  parts.forEach(function(p){ p.x+=p.vx; p.y+=p.vy; p.vy+=.04; p.r+=p.vr; cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle=p.c; cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); cx.restore(); });
  anim=parts.length? requestAnimationFrame(dc):null; }
var AC=null;
function sfx(k){ try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==="suspended") AC.resume(); var n=AC.currentTime;
  var T=function(f,t,d,ty,v){ var o=AC.createOscillator(),g=AC.createGain(); o.type=ty||"sine"; o.frequency.value=f; g.gain.setValueAtTime(0,n+t); g.gain.linearRampToValueAtTime(v||.16,n+t+.02); g.gain.exponentialRampToValueAtTime(.001,n+t+d); o.connect(g); g.connect(AC.destination); o.start(n+t); o.stop(n+t+d+.05); };
  if(k==="beep") T(880,0,.15,"square",.05);
  else if(k==="chip"){ T(1400,0,.06,"triangle",.12); T(1900,.05,.08,"triangle",.1); }
  else if(k==="level") [392,523,659,784].forEach(function(f,i){ T(f,i*.12,.4,"sawtooth",.07); });
  else if(k==="spin") for(var i=0;i<26;i++) T(500+Math.random()*500,Math.pow(i/26,1.8)*4,.05,"square",.035);
  else if(k==="tada"){ [523,659,784].forEach(function(f){ T(f,0,1,"sawtooth",.06); }); [1046,1318].forEach(function(f){ T(f,.25,.9,"triangle",.09); }); }
  else if(k==="wasted"){ T(220,0,1.4,"sawtooth",.1); T(110,0,1.6,"sine",.2); }
}catch(e){} }

/* ---------- Sync ---------- */
var SY=P.sync("tafel",function(ev,p){
  if(ev==="op"&&p) op(p);
  else if(ev==="hello") broadcast();
},function(ok){ $("conn").classList.toggle("ok",ok); });
SY.onUp=broadcast;
function broadcast(){ var o={}; for(var k in S) if(k!=="log") o[k]=S[k]; o.now=Date.now(); o.canUndo=S.log.length? S.log[S.log.length-1].l : ""; SY.send("state",o); }
function ack(id,dup,msg){ SY.send("ack",{id:id,msg:msg||""}); }
setInterval(broadcast,5000);

/* ---------- Laptop-Steuerung ---------- */
$("bPlay").onclick=function(){ op({op:"toggle"}); };
$("bEv").onclick=function(){ op({op:"ev"}); };
$("bDone").onclick=function(){ op({op:"evdone"}); };

var ctl=$("ctl"), hT; function ah(){ ctl.classList.remove("hide"); clearTimeout(hT); hT=setTimeout(function(){ ctl.classList.add("hide"); },5000); }
document.addEventListener("mousemove",ah); document.addEventListener("touchstart",ah,{passive:true});
document.addEventListener("keydown",function(e){ var k=e.key.toLowerCase();
  if(k===" "){ e.preventDefault(); if(S.ev){ if(Date.now()-S.ev.ts>4000) op({op:"evdone"}); } else op({op:"toggle"}); }
  else if(k==="arrowright") op({op:"lvl",d:1}); else if(k==="arrowleft") op({op:"lvl",d:-1});
  else if(k==="e") op({op:"ev"}); else if(k==="f") fs(); else if(k==="p") showPhoto();
  else if(k==="escape"){ $("show").classList.remove("on"); }
});
$("show").onclick=function(){ $("show").classList.remove("on"); };

if(!S.evAt&&!S.running) rollEv();
if(S.running&&S.endsAt<Date.now()-8*3600*1000) S.running=false;
save(); ticker(); render(); ah(); broadcast();
setInterval(loop,250);
window.__party={op:op,S:function(){return S}};
})();
</script>
